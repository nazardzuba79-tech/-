<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VOLTEX — TradingView Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0b0e11;color:#eaecef;font-family:Inter,Arial,sans-serif;overflow:hidden}
    .wrap{display:flex;flex-direction:column;width:100%;height:100%}
    .head{height:42px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#111820;border-bottom:1px solid #26313c;box-sizing:border-box}
    .brand{font-weight:800;letter-spacing:.12em}.note{font-size:12px;color:#8e99a8}
    .tradingview-widget-container{flex:1;min-height:0}
    .tradingview-widget-container__widget{width:100%;height:calc(100% - 28px)}
    .tradingview-widget-copyright{height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#0b0e11}
    .tradingview-widget-copyright a{color:#2962ff;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><div class="brand">VOLTEX</div><div class="note">Публичный preview TradingView — вход не нужен</div></div>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/symbols/BTCUSDT/?exchange=BYBIT" rel="noopener nofollow" target="_blank">BTC/USDT chart</a><span>&nbsp;by TradingView</span>
      </div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "autosize": true,
        "symbol": "BYBIT:BTCUSDT",
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "backgroundColor": "#0b0e11",
        "gridColor": "rgba(42, 46, 57, 0.35)",
        "style": "1",
        "locale": "ru",
        "hide_side_toolbar": false,
        "hide_top_toolbar": false,
        "hide_legend": false,
        "hide_volume": false,
        "allow_symbol_change": true,
        "withdateranges": true,
        "save_image": false,
        "calendar": false,
        "details": false,
        "hotlist": false,
        "watchlist": [],
        "compareSymbols": [],
        "studies": [],
        "show_popup_button": false,
        "support_host": "https://www.tradingview.com"
      }
      </script>
    </div>
  </div>
</body>
</html>
