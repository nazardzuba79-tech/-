server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite hashes every build's JS/CSS filenames (index-<hash>.js), so a new
    # deploy always gets brand-new asset URLs — safe to cache these forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself is NOT hashed and has no Cache-Control by default,
    # which lets browsers cache it heuristically — after a deploy, a
    # returning visitor can keep getting the OLD index.html (pointing at
    # old/now-missing hashed bundles) until that heuristic cache expires,
    # even after a manual refresh. Forcing revalidation on every load is
    # what actually fixes "I pushed but nothing changed on the live site".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: any path that isn't a real file falls back to index.html
    # so React Router (client-side routing) handles it instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
