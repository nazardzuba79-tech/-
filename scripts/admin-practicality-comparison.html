<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOLTEX Admin · до / після</title>
<style>body{margin:0;background:#eef1f6;color:#202a3a;font:15px/1.5 system-ui}header{padding:20px 28px;background:#fff;border-bottom:1px solid #dce2eb}h1{font-size:22px;margin:0}p{margin:6px 0;color:#596578}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}select,nav a{padding:9px 12px;border:1px solid #cfd7e3;border-radius:7px;background:#fff;color:#273b61}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px}figure{margin:0;min-width:0}figcaption{font-weight:650;margin-bottom:10px}img{display:block;width:100%;border:1px solid #d4dce8;border-radius:8px;background:#fff}body.mobile main{max-width:900px;margin:auto}small{color:#66758c}@media(max-width:700px){main{grid-template-columns:1fr;padding:12px}}</style>
<header><h1>VOLTEX Admin: порівняння до / після</h1><p>Реальний зібраний інтерфейс із локальними тестовими даними. Production не змінено.</p><small>«До»: зафіксована попередня збірка. «Після»: кандидат з пагінацією, вкладками й відновленням помилок.</small><nav><label>Екран <select id="route"><option value="users">Користувачі</option><option value="users-qa-user-1">Картка користувача</option><option value="deposits">Поповнення</option><option value="withdrawals">Виводи</option><option value="kyc">KYC</option><option value="audit-log">Журнал дій</option><option value="otc">OTC</option></select></label><label>Ширина <select id="width"><option>1440</option><option>1920</option><option>1366</option><option>390</option></select></label><a href="/admin/users" target="_blank">Відкрити робочий preview ↗</a></nav></header>
<main><figure><figcaption>До</figcaption><a id="before-link" target="_blank"><img id="before" alt="Admin до змін"></a></figure><figure><figcaption>Після</figcaption><a id="after-link" target="_blank"><img id="after" alt="Admin після змін"></a></figure></main>
<script>function render(){const slug=document.getElementById('route').value,width=document.getElementById('width').value;document.body.classList.toggle('mobile',width==='390');for(const mode of ['before','after']){const src=mode+'/'+slug+'-'+width+'.png';document.getElementById(mode).src=src;document.getElementById(mode+'-link').href=src}}document.getElementById('route').onchange=render;document.getElementById('width').onchange=render;render();</script></html>
