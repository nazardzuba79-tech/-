# PREPARATION ONLY: resolve and approve exact image + commit before use.
# Apply after the existing production Compose chain, to api-production ONLY.
services:
  api-production:
    image: ${DEMO_RELEASE_IMAGE:?Exact verified inactive image required}
    environment:
      VOLTEX_RELEASE_SHA: ${DEMO_RELEASE_SHA:?Exact reviewed release commit required}
      DEMO_SPOT_ENABLED: "false"
      DEMO_LIQUIDITY_ENABLED: "false"
      DEMO_WITHDRAWAL_GUARD_ENABLED: "false"
    command: ["node", "dist/index.js"]
