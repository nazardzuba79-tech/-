services:
  - type: web
    name: exchange-api
    runtime: docker
    plan: free
    region: frankfurt # closest/best-connected Render region to Russia/CIS/Europe
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false # set manually — paste your Neon POOLED connection string
      - key: DIRECT_URL
        sync: false # set manually — paste your Neon DIRECT (non-pooled) connection string; required for `prisma migrate deploy` to acquire its advisory lock reliably, see prisma/schema.prisma
      - key: JWT_SECRET
        sync: false # set manually ONCE in the Render dashboard, e.g. `openssl rand -hex 32` — do NOT use generateValue here: every Blueprint sync it can be regenerated, which silently invalidates every logged-in session (this is what was logging users out). Once you set a fixed value here, never change it — it must stay the same across every future deploy.
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false # set manually — generate with: openssl rand -hex 32
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        sync: false # set manually to your frontend's Render URL once you have it
      - key: REGISTRATION_OPEN
        value: "true"
      - key: BITCOIN_TREASURY_ADDRESS
        sync: false # optional — only needed if you want Bitcoin deposits working; your own wallet address (e.g. Trust Wallet)
      - key: BITCOIN_NATIVE_ASSET
        value: BTC
      - key: TRON_TREASURY_ADDRESS
        sync: false # optional — only needed if you want USDT-TRC20 deposits working; your own wallet address (e.g. Trust Wallet)
      - key: TRON_NATIVE_ASSET
        value: TRX
      - key: TRON_TOKENS
        value: "USDT:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t:6"
      - key: ETHEREUM_TREASURY_ADDRESS
        sync: false # optional — only needed if you want Ethereum (ETH + ERC-20 USDT) deposits working; your own wallet address (e.g. Trust Wallet)
      - key: ETHEREUM_NATIVE_ASSET
        value: ETH
      - key: ETHEREUM_RPC_URL
        value: "https://ethereum.publicnode.com" # free public RPC, no signup — verifies one tx at credit time
      - key: ETHEREUM_TOKENS
        value: "USDT:0xdAC17F958D2ee523a2206206994597C13D831ec7:6"
      - key: ETHEREUM_API_KEY
        sync: false # optional — free key from https://etherscan.io/apis, powers the admin's incoming-transfers feed

  - type: web
    name: exchange-frontend
    runtime: docker
    plan: free
    region: frankfurt # keep both services in the same region — matters less
    # for this one (it's just static files behind Render's own CDN either
    # way) but no reason not to match the backend
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        sync: false # set manually to https://exchange-api-xxxx.onrender.com/api/v1
