services:
  - type: web
    name: exchange-api
    runtime: docker
    plan: free
    region: frankfurt # closest/best-connected Render region to Russia/CIS/Europe
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false # set manually — paste your Neon connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false # set manually — generate with: openssl rand -hex 32
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        sync: false # set manually to your frontend's Render URL once you have it
      - key: REGISTRATION_OPEN
        value: "true"
      - key: BITCOIN_TREASURY_ADDRESS
        sync: false # optional — only needed if you want Bitcoin deposits working; your own wallet address (e.g. Trust Wallet)
      - key: BITCOIN_NATIVE_ASSET
        value: BTC
      - key: TRON_TREASURY_ADDRESS
        sync: false # optional — only needed if you want USDT-TRC20 deposits working; your own wallet address (e.g. Trust Wallet)
      - key: TRON_NATIVE_ASSET
        value: TRX
      - key: TRON_TOKENS
        value: "USDT:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t:6"

  - type: web
    name: exchange-frontend
    runtime: docker
    plan: free
    region: frankfurt # keep both services in the same region — matters less
    # for this one (it's just static files behind Render's own CDN either
    # way) but no reason not to match the backend
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        sync: false # set manually to https://exchange-api-xxxx.onrender.com/api/v1
