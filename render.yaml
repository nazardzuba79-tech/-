services:
  - type: web
    name: exchange-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false # set manually — paste your Neon connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        sync: false # set manually to your frontend's Render URL once you have it
      - key: REGISTRATION_OPEN
        value: "true"
      - key: ETHEREUM_RPC_URL
        sync: false # optional — only needed if you want deposits working
      - key: ETHEREUM_TREASURY_ADDRESS
        sync: false
      - key: ETHEREUM_MIN_CONFIRMATIONS
        value: 12
      - key: ETHEREUM_NATIVE_ASSET
        value: ETH
      - key: ETHEREUM_TOKENS
        sync: false

  - type: web
    name: exchange-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        sync: false # set manually to https://exchange-api-xxxx.onrender.com/api/v1
