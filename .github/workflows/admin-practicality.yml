name: Admin operational workflow fixtures
'on':
  push:
    branches:
      - codex/release-qa-validation-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-validation-20261006-admin-practicality.yml
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9866714f1541bb878eb1aa01176d6ac97059b177
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = '9866714f1541bb878eb1aa01176d6ac97059b177'
          echo 'RELEASE_QA_SOURCE_SHA=9866714f1541bb878eb1aa01176d6ac97059b177'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Build against local fixture endpoints
        env:
          VITE_API_URL: /api/v1
          VITE_MANUAL_DEPOSIT_CATALOGUE: 'true'
          VITE_DEPOSIT_CATALOGUE_URL: 'http://127.0.0.1:4402/api/v1/deposit-catalogue'
        run: npm run build --prefix frontend
      - name: Disposable browser
        run: >
          npm install --prefix /tmp/admin-practicality-qa --no-save --ignore-scripts --no-audit --no-fund
          playwright@1.56.1

          node /tmp/admin-practicality-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Four-width screenshot and overflow checks
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/admin-practicality-qa/node_modules/playwright
          QA_BROWSER: chromium
        run: node scripts/qa-admin-practicality.cjs
      - name: 'Navigation, failure and uncertain-response recovery'
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/admin-practicality-qa/node_modules/playwright
          QA_BROWSER: chromium
          QA_INTERACTIONS: '1'
        run: node scripts/qa-admin-practicality.cjs
      - name: Modern and legacy API compatibility at six widths
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/admin-practicality-qa/node_modules/playwright
          QA_BROWSER: chromium
          QA_COMPATIBILITY: '1'
          QA_OUT: output/admin-practicality/api-compatibility
        run: node scripts/qa-admin-practicality.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-operational-workflow-fixtures
          path: output/admin-practicality
          retention-days: 7
