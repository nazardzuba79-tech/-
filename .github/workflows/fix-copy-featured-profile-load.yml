name: Fix copy featured profile load
on:
  push:
    branches: ['codex/copy-trading-locked-list']
    paths: ['.github/workflows/fix-copy-featured-profile-load.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify fresh state
        run: |
          git fetch origin main codex/copy-trading-locked-list
          test "$(git rev-parse origin/main)" = "54a410ef52c8c50932d95b53e90d5d88446cd165"
          test "$(git rev-parse origin/codex/copy-trading-locked-list)" = "$GITHUB_SHA"
      - name: Replace fragile animation-frame gate
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/copy-trading-bolt/components.tsx')
          s=p.read_text()
          old='''  useEffect(() => {\n    setDetailsReady(false);\n    let secondFrame = 0;\n    const firstFrame = window.requestAnimationFrame(() => {\n      secondFrame = window.requestAnimationFrame(() => setDetailsReady(true));\n    });\n    return () => { window.cancelAnimationFrame(firstFrame); if (secondFrame) window.cancelAnimationFrame(secondFrame); };\n  }, [trader.id]);'''
          new='''  useEffect(() => {\n    setDetailsReady(false);\n    // Use a normal task instead of requestAnimationFrame. rAF can be throttled\n    // or paused by some browser/tab states, which left featured profiles on\n    // the loading shell indefinitely. A short timer still lets the identity\n    // header paint first, then deterministically mounts the analytics.\n    const timer = window.setTimeout(() => setDetailsReady(true), 16);\n    return () => window.clearTimeout(timer);\n  }, [trader.id]);'''
          assert old in s, 'expected profile gate not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Frontend production build
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/fix-copy-featured-profile-load.yml
          git config user.name 'VOLTEX copy profile fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/copy-trading-bolt/components.tsx
          git commit -m 'Make featured copy profiles exit loading reliably'
          git push origin HEAD:refs/heads/codex/copy-trading-locked-list
