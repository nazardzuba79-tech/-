name: Beget RU preflight offline contract
on:
  pull_request:
    paths:
      - 'scripts/qa-beget-ru-preflight.mjs'
      - 'scripts/qa-beget-ru-preflight.test.mjs'
      - 'docs/BEGET_RU_GATEWAY_HANDOFF.md'
      - '.github/workflows/beget-ru-preflight.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: node --test scripts/qa-beget-ru-preflight.test.mjs
