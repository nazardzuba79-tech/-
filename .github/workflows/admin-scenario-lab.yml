# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: 'Admin scenario laboratory (isolated, no trading)'
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-20261006-admin-scenario-lab.yml
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: 'Isolation, deterministic OHLC and Russian interface'
        run: >-
          npx jest --runInBand --runTestsByPath frontend/src/lib/__tests__/listingScenarioLab.test.ts
          frontend/src/lib/__tests__/adminListingsRussianCopy.test.ts
      - name: Build actual frontend
        env:
          VITE_API_URL: /api/v1
        run: npm run build --prefix frontend
      - name: Install isolated Chromium tooling
        run: |
          npm install --prefix /tmp/scenario-lab-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node /tmp/scenario-lab-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: 'Actual admin page, desktop and mobile, every network write refused'
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/scenario-lab-qa/node_modules/playwright
        run: node scripts/qa-listing-scenario-lab.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-scenario-lab-evidence
          path: docs/qa/admin-scenario-lab/
          retention-days: 7
