name: Wallet performance regression
'on':
  push:
    branches:
      - codex/release-qa-final-20261006
permissions:
  contents: read
jobs:
  wallet-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca69d47eaccccf18a1bd7e45e34452fcd60e9e91
          persist-credentials: false
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = 'ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
          echo 'RELEASE_QA_SOURCE_SHA=ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Backend TypeScript
        run: npm run build
      - name: Wallet performance tests
        run: >-
          npm test -- --runInBand --json --outputFile=wallet-performance-tests.json --runTestsByPath
          src/services/__tests__/WalletPortfolioService.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-performance-tests
          path: wallet-performance-tests.json
concurrency:
  group: release-qa-final-20261006-wallet-performance.yml
  cancel-in-progress: false
