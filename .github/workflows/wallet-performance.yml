# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Wallet performance regression
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
jobs:
  wallet-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
          persist-credentials: false
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Backend TypeScript
        run: npm run build
      - name: Wallet performance tests
        run: >-
          npm test -- --runInBand --json --outputFile=wallet-performance-tests.json --runTestsByPath
          src/services/__tests__/WalletPortfolioService.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-performance-tests
          path: wallet-performance-tests.json
concurrency:
  group: release-qa-20261006-wallet-performance.yml
  cancel-in-progress: false
