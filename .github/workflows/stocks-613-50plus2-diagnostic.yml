name: Stocks 613 50+2 paired diagnostic (report only)

# Interleaved before/after runs of the unchanged 50+2 plan (50 viewers, 2
# synthetic traders, 80 crypto cycles) on a fresh GitHub-hosted runner. Each
# harness process tree, PostgreSQL included, is pinned to 2 vCPUs. Own
# PostgreSQL, synthetic users and loopback only: no secrets, no deployment,
# no external market. CI_DIAGNOSTIC: never capacity acceptance.
on:
  pull_request:
    paths:
      - '.github/workflows/stocks-613-50plus2-diagnostic.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stocks-613-50plus2-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  paired-runs:
    name: 50+2 paired before/after (2 vCPU, report only)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PAIRS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Locked dependencies and Prisma engines, before any harness admission
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
      - name: Fixture base schema and PostgreSQL socket directory
        run: |
          git cat-file -e 58540f49aed5d47a4458ab11270e0cb3aa7d26ce^{commit} 2>/dev/null ||
            git fetch --no-tags --depth=1 origin 58540f49aed5d47a4458ab11270e0cb3aa7d26ce
          sudo install -d -m 1777 /var/run/postgresql
          ls -d /usr/lib/postgresql/*/bin
      - name: Collection-gate self-test on stored results (no benchmark)
        run: node --test scripts/qa/stocks-rc-50plus2/summarize-613.test.cjs
      - name: Worktrees with runtime exactly at each pin; harness from this head
        run: |
          set -euo pipefail
          W="$(dirname "$GITHUB_WORKSPACE")/rc50"; mkdir -p "$W/runs"
          echo node_modules >> "$(git rev-parse --git-common-dir)/info/exclude"
          for kind in before after; do
            policy=policy-613.cjs; [ "$kind" = after ] && policy=policy-613-after.cjs
            sha=$(node -p "require('./scripts/qa/stocks-rc-50plus2/$policy').RC")
            git worktree add --detach "$W/$kind" "$sha"
            cp scripts/qa/stocks-rc-50plus2/*.cjs scripts/qa/stocks-rc-50plus2/README.txt "$W/$kind/scripts/qa/stocks-rc-50plus2/"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$W/$kind/node_modules"
            git -C "$W/$kind" status --short
          done
          echo "RC50_DIR=$W" >> "$GITHUB_ENV"
      - name: Interleaved runs (ABBA), each pinned to 2 vCPUs
        run: |
          set -uo pipefail
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          # Every run goes ahead whatever the previous one returned; its exit code
          # is kept as raw evidence, and the collection gate below judges the set.
          run() {
            local kind=$1 i=$2 flag="" rc=0; [ "$kind" = after ] && flag="--after"
            mkdir -p "$RC50_DIR/runs/$kind-$i"
            (cd "$RC50_DIR/$kind" && taskset -c 0,1 node scripts/qa/stocks-rc-50plus2/diagnostic-run-613.cjs $flag \
              --root . --pg-bin "$PG_BIN" --out "$RC50_DIR/runs/$kind-$i/out" \
              --scope ci-diagnostic --ack SYNTHETIC_LOCAL_ONLY --run-local) || rc=$?
            echo "$rc" > "$RC50_DIR/runs/$kind-$i/exit-code"
          }
          for i in $(seq 1 "$PAIRS"); do
            if [ $((i % 2)) -eq 1 ]; then run before "$i"; run after "$i"; else run after "$i"; run before "$i"; fi
          done
      # Collection gate: fails unless every expected run (PAIRS per pin) is present,
      # parseable, pin-matched, measured on both arms, financially intact and cleaned
      # up. The p95 verdict is reported separately and never fails this step.
      - name: Collection gate and diagnostic report (p95 is report-only)
        if: always()
        run: |
          set -o pipefail
          node scripts/qa/stocks-rc-50plus2/summarize-613.cjs "$RC50_DIR/runs" "$RC50_DIR/summary.json" --pairs "$PAIRS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the numbers as check annotations (readable without sign-in)
        if: always()
        run: |
          node -e '
          const s = require(process.argv[1]), f = (x, d = 2) => typeof x === "number" ? x.toFixed(d) : "-";
          if (s.collection.status !== "COMPLETE") console.log(`::error title=50+2 collection ${s.collection.status} ${s.collection.completeRuns}/${s.collection.expectedRuns}::${s.collection.failures.slice(0, 12).join(" ")}`);
          for (const r of s.runs.slice(0, 8)) console.log(`::notice title=50+2 ${r.name} ${(r.runtime || "").slice(0, 8)}::${r.status} complete=${r.complete ? "yes" : "no"} dp95=${f(r.comparison?.cryptoP95ChangePercent)}% base/mixed p95=${f(r.baseline?.p95)}/${f(r.mixed?.p95)}ms apiCPU=${f(r.baseline?.apiCpuMs, 0)}/${f(r.mixed?.apiCpuMs, 0)}ms timeouts=${r.mixed?.timeouts ?? "-"} loss/double/viewer=${r.mixed ? [r.mixed.orderLoss, r.mixed.doubleSpend, r.mixed.viewerMutations].join("/") : "-"}`);
          for (const [k, v] of Object.entries(s.kinds)) console.log(`::notice title=50+2 ${k} ${(v.pin || "").slice(0, 8)} pooled::collection ${s.collection.status} complete ${v.completeRuns}/${v.runs} ${v.diagnosticP95} medianRunDp95=${f(v.medianRunDeltaPercent)}% pooledP95 base/mixed=${f(v.pooledBaselineP95Ms)}/${f(v.pooledMixedP95Ms)}ms pooledDp95=${f(v.pooledDeltaPercent)}% viewerInducedApiCPU=${f(v.meanViewerInducedApiCpuMs, 0)}ms meanMixedApiCPU=${f(v.meanMixedApiCpuMs, 0)}ms`);
          ' "$RC50_DIR/summary.json"
      - name: Collect run reports (no database files)
        if: always()
        run: |
          mkdir -p output/rc50-613
          cp "$RC50_DIR/summary.json" output/rc50-613/ 2>/dev/null || true
          for r in "$RC50_DIR"/runs/*/; do
            n=$(basename "$r"); mkdir -p "output/rc50-613/$n"
            cp "$r"exit-code "$r"out/*.json "$r"out/*.log "output/rc50-613/$n/" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-613-50plus2-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/rc50-613
          retention-days: 14
          if-no-files-found: error

  # One server-side spans run (spans.cjs in BOTH measured arms) of the current
  # runtime pin (policy-613-after.cjs) with the unchanged plan, to separate auth,
  # Prisma/transaction and event-loop time behind the crypto p95. Same host
  # shape as above (GitHub-hosted, ci-diagnostic admission, 2 vCPUs, own
  # PostgreSQL, synthetic users, loopback only). Not a p95 verdict: the
  # instrumentation overhead applies to both arms and is not removed.
  # ONE RUN, approved by the #613 coordinator (2026-10-26): only the first
  # attempt of the #613 push whose previous head is 77b4fffc, from this
  # repository. No later push and no re-run can fire it. The next commit
  # restores `if: false`.
  spans-run:
    name: 50+2 server-side spans, one run (diagnostic, not a p95 verdict)
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      github.event.pull_request.number == 613 && github.run_attempt == '1' &&
      github.event.before == '77b4fffc28dc629b36840e821828ab7aa9dd267b' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Locked dependencies and Prisma engines, before any harness admission
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
      - name: Fixture base schema and PostgreSQL socket directory
        run: |
          git cat-file -e 58540f49aed5d47a4458ab11270e0cb3aa7d26ce^{commit} 2>/dev/null ||
            git fetch --no-tags --depth=1 origin 58540f49aed5d47a4458ab11270e0cb3aa7d26ce
          sudo install -d -m 1777 /var/run/postgresql
      - name: Spans summary self-test on synthetic data (no workload)
        run: node --test scripts/qa/stocks-rc-50plus2/spans-summary-613.test.cjs
      - name: Worktree with runtime exactly at the after pin; harness from this head
        run: |
          set -euo pipefail
          W="$(dirname "$GITHUB_WORKSPACE")/rc50-spans"; mkdir -p "$W"
          echo node_modules >> "$(git rev-parse --git-common-dir)/info/exclude"
          sha=$(node -p "require('./scripts/qa/stocks-rc-50plus2/policy-613-after.cjs').RC")
          git worktree add --detach "$W/after" "$sha"
          cp scripts/qa/stocks-rc-50plus2/*.cjs scripts/qa/stocks-rc-50plus2/README.txt "$W/after/scripts/qa/stocks-rc-50plus2/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$W/after/node_modules"
          echo "SPANS_DIR=$W" >> "$GITHUB_ENV"
      - name: One spans run, pinned to 2 vCPUs
        run: |
          set -uo pipefail
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1); rc=0
          (cd "$SPANS_DIR/after" && taskset -c 0,1 node scripts/qa/stocks-rc-50plus2/diagnostic-run-613.cjs --after --spans \
            --root . --pg-bin "$PG_BIN" --out "$SPANS_DIR/out" \
            --scope ci-diagnostic --ack SYNTHETIC_LOCAL_ONLY --run-local) || rc=$?
          echo "$rc" > "$SPANS_DIR/exit-code"
      - name: Spans decomposition (fails closed on missing or truncated spans)
        if: always()
        run: |
          set -o pipefail
          node scripts/qa/stocks-rc-50plus2/spans-summary-613.cjs "$SPANS_DIR/out" "$SPANS_DIR/spans-summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect run reports and raw spans (no database files)
        if: always()
        run: |
          mkdir -p output/rc50-613-spans
          cp "$SPANS_DIR/exit-code" "$SPANS_DIR/spans-summary.json" "$SPANS_DIR"/out/*.json "$SPANS_DIR"/out/*.log output/rc50-613-spans/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-613-spans-${{ github.event.pull_request.head.sha }}
          path: output/rc50-613-spans
          retention-days: 14
          if-no-files-found: error
