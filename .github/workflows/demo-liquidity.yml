name: Internal demo liquidity
on:
  pull_request:
    paths:
      - 'src/services/DemoLiquidity.ts'
      - 'src/services/DemoTradingService.ts'
      - 'src/services/SpotBookTransaction.ts'
      - 'src/api/routes/demoTrading.ts'
      - 'src/index.ts'
      - 'src/services/__tests__/DemoLiquidity.test.ts'
      - 'src/services/__tests__/DemoTradingService.test.ts'
      - 'src/api/routes/__tests__/demoTrading.test.ts'
      - 'frontend/src/components/OrderForm.tsx'
      - 'frontend/src/lib/demoSpot.ts'
      - 'scripts/*demo-liquidity*.cjs'
      - 'docs/DEMO_LIQUIDITY.md'
      - '.github/workflows/demo-liquidity.yml'
permissions:
  contents: read
jobs:
  demo-liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npx prisma generate
      - name: Backend build
        run: npm run build
      # Demo Spot is switched on only in this disposable QA build; it is never deployed.
      - name: Frontend build (isolated QA, demo Spot on)
        env:
          VITE_DEMO_SPOT_ENABLED: 'true'
        run: npm run build
        working-directory: frontend
      - name: Liquidity configuration, quotes, settlement and the admin status route
        run: >-
          npm test -- --runInBand --json --outputFile=demo-liquidity-tests.json
          --runTestsByPath
          src/services/__tests__/DemoLiquidity.test.ts
          src/services/__tests__/DemoTradingService.test.ts
          src/api/routes/__tests__/demoTrading.test.ts
      - name: Isolated QA tools only (not application dependencies)
        run: |
          npm install --prefix output/demo-qa-deps --no-save --ignore-scripts --no-audit --no-fund pg@8.23.1 playwright@1.63.0
          output/demo-qa-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Runner PostgreSQL tools (new temporary cluster only)
        run: |
          pg_config --version
          echo "DEMO_QA_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Disposable PostgreSQL and network-denied browser QA
        env:
          DEMO_QA_BROWSER: '1'
        run: node scripts/test-demo-liquidity-postgres.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-liquidity-evidence
          path: |
            demo-liquidity-tests.json
            output/demo-liquidity/*.json
            output/demo-liquidity/*.png
            output/demo-liquidity/*.log
