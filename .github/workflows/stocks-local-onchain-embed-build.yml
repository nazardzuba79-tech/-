name: VOLTEX Stocks local onchain embed isolated build and browser proof
'on':
  push:
    branches:
      - work/stocks-onchain-local-embed-20261025
    paths:
      - .github/workflows/stocks-local-onchain-embed-build.yml
      - frontend/src/pages/stocks/StocksOnchainEmbedPreview.tsx
      - frontend/src/pages/stocks/onchainPoolCatalogue.ts
      - frontend/src/pages/stocks/onchainDiscoveredCandidates.ts
      - frontend/src/pages/stocks/onchainXStocksCatalogue.generated.json
      - frontend/src/pages/stocks/stocksOnchainEmbedPreview.css
      - scripts/stocks-onchain-embed-browser-qa.mjs
      - scripts/stocks-onchain-release-gate.mjs
      - scripts/stocks-onchain-release-gate.test.mjs
permissions:
  contents: read
concurrency:
  group: stocks-local-onchain-embed-build
  cancel-in-progress: false
jobs:
  build-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify seven onchain pool guards, strict localhost flag and 58 candidate sources
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {ONCHAIN_EMBED_MARKETS,mayMountOnchainEmbedPreview,onchainEmbedUrl,onchainPoolUrl} from './frontend/src/pages/stocks/onchainEmbedPreviewData.ts';
          import {STOCKS_DISCOVERED_CANDIDATES} from './frontend/src/pages/stocks/onchainDiscoveredCandidates.ts';
          assert.equal(STOCKS_DISCOVERED_CANDIDATES.length,58);
          assert.equal(new Set(STOCKS_DISCOVERED_CANDIDATES.map(x=>x.ticker)).size,58);
          assert.ok(STOCKS_DISCOVERED_CANDIDATES.every(x=>x.verifiedOnChain===false));
          assert.equal(ONCHAIN_EMBED_MARKETS.length,7);
          assert.equal(mayMountOnchainEmbedPreview('127.0.0.1',true,'1'),true);
          for(const [host,dev,flag] of [['voltextech.net',true,'1'],['preview.voltextech.net',true,'1'],
            ['localhost',true,'1'],['127.0.0.1',false,'1'],['127.0.0.1',true,'0']]) {
            assert.equal(mayMountOnchainEmbedPreview(host,dev,flag),false);
          }
          for (const m of ONCHAIN_EMBED_MARKETS) {
            const u=new URL(onchainEmbedUrl(m));
            assert.equal(u.origin,'https://www.geckoterminal.com');
            assert.equal(u.pathname,'/solana/pools/'+m.pool);
            assert.equal(u.searchParams.get('embed'),'1');
            assert.equal(onchainPoolUrl(m),u.origin+u.pathname);
          }
          assert.throws(()=>onchainEmbedUrl({...ONCHAIN_EMBED_MARKETS[0],pool:'fake'}),/UNKNOWN_MARKET/);
          console.log('PASS strict LOCAL-only gating, 58 candidates, 7 independent checked pool references');
          NODE
      - name: Check catalogue provenance, negative safety cases and release NO-GO
        shell: bash
        env:
          STOCKS_RELEASE_GATE_OUTPUT: ${{ runner.temp }}/stocks-embed-evidence/release-gate.json
        run: |
          set -euo pipefail
          node --test scripts/stocks-onchain-release-gate.test.mjs
          node scripts/stocks-onchain-release-gate.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Full frontend TypeScript check and production build (preview OFF)
        working-directory: frontend
        env:
          VITE_STOCKS_ONCHAIN_EMBED_PREVIEW: '0'
        run: npm run build
      - name: Install Chromium for single browser-evidence sweep
        shell: bash
        run: |
          npm install --prefix /tmp/stocks-qa-playwright --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/stocks-qa-playwright/node_modules/playwright/cli.js install chromium
      - name: Check 58 iframe navigations, pool selection, mobile and reload (preview LOCAL only)
        shell: bash
        env:
          STOCKS_QA_TICKERS: 'SPYx,NVDAx,CRCLx'
          STOCKS_EMBED_QA_DIR: ${{ runner.temp }}/stocks-embed-evidence
        run: |
          set -euo pipefail
          mkdir -p "$STOCKS_EMBED_QA_DIR"
          cd frontend
          VITE_STOCKS_ENABLED=true VITE_STOCKS_WIDGET_PREVIEW=true VITE_STOCKS_ONCHAIN_EMBED_PREVIEW=1 npm run dev -- --host 127.0.0.1 > "$STOCKS_EMBED_QA_DIR/vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/stocks >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd ..
          node scripts/stocks-onchain-embed-browser-qa.mjs
      - name: Upload evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocks-onchain-embed-browser-${{ github.sha }}
          path: ${{ runner.temp }}/stocks-embed-evidence/
          if-no-files-found: warn
          retention-days: 4
