name: Stocks Isolated Positive PG TLS — 98c577d4

# Owner-authorized single label event. Never dispatch, push, schedule or deploy.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: stocks-positive-pg-tls-98c577d4-once
  cancel-in-progress: false

jobs:
  positive-pg-tls:
    if: >-
      github.repository == 'nazardzuba79-tech/-' &&
      github.event.repository.private == false &&
      github.event.label.name == 'stocks-positive-pg-tls-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/stocks-pg-tls-smoke-98c577d4-20261020' &&
      github.event.pull_request.base.ref == 'codex/stocks-build-only-f97b7f9c-20261020' &&
      github.event.pull_request.base.sha == '98c577d4241ce527f7bfca3b78dd7bb78255e300' &&
      github.event.pull_request.draft == true &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact smoke harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 98c577d4241ce527f7bfca3b78dd7bb78255e300
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.23.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Rebuild images and execute one isolated positive smoke
        shell: bash
        run: |
          set -euo pipefail
          node control/review/stocks-pg-tls-98c577d4/run.cjs "$GITHUB_WORKSPACE/source"
      - name: Preserve failure boundary
        if: failure()
        shell: bash
        run: |
          printf '\n**FAIL: no rerun authorized.** Inspect sanitized stage/container logs and partial receipt. REAL_PRODUCTION_BOOTSTRAP=NOT_RUN. No production readiness claim.\n' >> "$GITHUB_STEP_SUMMARY"

# No secrets, OIDC, environment, reusable workflow, registry push, artifact upload,
# production URL, external database, deploy action, or self-hosted/paid runner.
# Images and generated keys exist only in the disposable runner.
