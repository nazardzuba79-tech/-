name: Support chat and email delivery

on:
  pull_request:
    paths:
      - 'src/api/routes/support.ts'
      - 'src/api/routes/adminSupport.ts'
      - 'src/api/routes/__tests__/support.test.ts'
      - 'src/api/routes/__tests__/adminSupport.test.ts'
      - 'src/services/SupportEmailService.ts'
      - 'src/services/SupportNotificationOutbox.ts'
      - 'src/services/__tests__/SupportEmailService.test.ts'
      - 'src/services/__tests__/SupportNotificationOutbox.test.ts'
      - 'src/services/__tests__/supportNotificationPostgres.test.ts'
      - 'src/services/__tests__/NodemailerCompatibility.test.ts'
      - 'src/api/middleware/**'
      - 'src/index.ts'
      - 'prisma/**'
      - 'frontend/src/components/SupportWidget.tsx'
      - 'frontend/src/components/SupportWidget.css'
      - 'frontend/src/pages/admin/**'
      - 'frontend/src/lib/__tests__/supportAdmin.test.ts'
      - 'frontend/src/App.tsx'
      - 'scripts/qa-support-email.cjs'
      - '.github/workflows/support-email.yml'

permissions:
  contents: read

concurrency:
  group: support-email-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  support-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: support_qa
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: voltex_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_qa -d voltex_support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable loopback database only; no SMTP secret exists in CI —
      # mail goes to a local sink inside the QA script.
      DATABASE_URL: postgresql://support_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_support_test?schema=public
      DIRECT_URL: postgresql://support_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_support_test?schema=public
      SUPPORT_TEST_DATABASE_URL: postgresql://support_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_support_test?schema=public
      SUPPORT_QA_DATABASE_URL: postgresql://support_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_support_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Additive migration on an empty database
        run: npx prisma migrate deploy
      - name: Mail service, outbox, API, admin and PostgreSQL integration
        run: >-
          npx jest --runInBand --silent --runTestsByPath
          src/services/__tests__/SupportEmailService.test.ts
          src/services/__tests__/NodemailerCompatibility.test.ts
          src/services/__tests__/SupportNotificationOutbox.test.ts
          src/services/__tests__/supportNotificationPostgres.test.ts
          src/api/routes/__tests__/support.test.ts
          src/api/routes/__tests__/adminSupport.test.ts
          frontend/src/lib/__tests__/supportAdmin.test.ts
          frontend/src/lib/__tests__/routeCodeSplitting.test.ts
      - name: Backend typecheck and build
        run: npm run build
      - name: Production frontend build
        run: npm run build --prefix frontend
      - name: Disposable Chromium
        run: |
          npm install --prefix /tmp/support-qa-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/support-qa-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Support chat → Postgres → outbox → SMTP sink, browser QA
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/support-qa-browser/node_modules/playwright
        run: node scripts/qa-support-email.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-email-${{ github.sha }}
          path: docs/qa/support-email/
          if-no-files-found: ignore
          retention-days: 7
