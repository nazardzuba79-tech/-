name: Futures design and Pro integration
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/test-utils/**'
      - 'src/private-trading/**'
      - '.github/workflows/futures-integration.yml'
permissions:
  contents: read
concurrency:
  group: futures-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration_qa
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: voltex_native_egress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_qa -d voltex_native_egress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable loopback database; both DB regression guards remain enabled.
      DATABASE_URL: postgresql://integration_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_native_egress_test?schema=public
      DIRECT_URL: postgresql://integration_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_native_egress_test?schema=public
      NATIVE_EGRESS_TEST_DATABASE_URL: postgresql://integration_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_native_egress_test?schema=public
      PRIVATE_TRADING_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      # The isolated review harness exercises the compiled production engine.
      - run: npm run build
      - run: npm run build --prefix frontend
      - run: npx prisma migrate deploy
      - name: Financial engine, calculator, transport and terminal regressions
        run: >-
          npm test -- --runInBand --silent --json --outputFile=futures-integration-tests.json
          src/private-trading/__tests__
          src/api/routes/__tests__/nativeDemoAccess.test.ts
          src/api/routes/__tests__/privateTrading.test.ts
          frontend/src/lib/__tests__/futures
          frontend/src/lib/__tests__/native
          frontend/src/lib/__tests__/chart
          frontend/src/lib/__tests__/priceChartMarketOrders.test.ts
          frontend/src/lib/__tests__/private
          frontend/src/lib/__tests__/i18nLanguageChunks.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futures-integration-tests
          path: futures-integration-tests.json
          retention-days: 7
