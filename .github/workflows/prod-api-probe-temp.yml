name: TEMP production API probe
on:
  pull_request:
    paths:
      - '.github/workflows/prod-api-probe-temp.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public production endpoints
        shell: bash
        run: |
          set -u
          probe() {
            name="$1"; url="$2"
            echo "::group::$name"
            curl -sS --max-time 20 -D /tmp/h -o /tmp/b -H 'Origin: https://voltextech.net' "$url" || true
            echo "--- status/headers ---"
            sed -n '1,30p' /tmp/h || true
            echo "--- body ---"
            head -c 3000 /tmp/b || true
            echo
            echo "::endgroup::"
          }
          probe health 'https://api.voltextech.net/health'
          probe candles 'https://api.voltextech.net/api/v1/market/futures/candles/BTC-USDT?interval=1h&limit=20'
          probe snapshot 'https://api.voltextech.net/api/v1/market/snapshot'
          probe symbols 'https://api.voltextech.net/api/v1/market/external/symbols'
          echo "::group::frontend-build"
          curl -sS --max-time 20 -D /tmp/fh -o /tmp/page 'https://voltextech.net/futures?pair=BTC%2FUSDT' || true
          sed -n '1,25p' /tmp/fh || true
          echo "--- script assets ---"
          grep -oE 'src="[^"]+\.js"' /tmp/page || true
          assets=$(grep -oE 'src="[^"]+\.js"' /tmp/page | sed 's/src="//;s/"$//' || true)
          for asset in $assets; do
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://voltextech.net$asset" ;;
              *) url="https://voltextech.net/$asset" ;;
            esac
            echo "FETCH $url"
            curl -sS --max-time 20 "$url" -o /tmp/main.js || true
            echo "--- endpoint strings in entry ---"
            grep -oE 'https://[^"[:space:]]+|exchange-api[^"[:space:]]+|api\.voltextech\.net|/api/v1' /tmp/main.js | head -100 || true
            echo "--- dynamic js refs ---"
            grep -oE 'assets/[A-Za-z0-9._-]+\.js' /tmp/main.js | sort -u | head -100 > /tmp/refs || true
            while read ref; do
              [ -n "$ref" ] || continue
              curl -sS --max-time 20 "https://voltextech.net/$ref" -o /tmp/chunk.js || true
              hits=$(grep -oE 'https://exchange-api[^"[:space:]]+|https://api\.voltextech\.net[^"[:space:]]*|/api/v1' /tmp/chunk.js | head -20 || true)
              if [ -n "$hits" ]; then
                echo "HITS $ref"
                echo "$hits"
              fi
            done < /tmp/refs
          done
          echo "::endgroup::"
          echo "::group::browser-production"
          npm install --prefix /tmp/prod-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0 >/dev/null 2>&1
          node /tmp/prod-browser/node_modules/playwright/cli.js install --with-deps chromium >/dev/null 2>&1
          PROD_PW=/tmp/prod-browser/node_modules/playwright node <<'NODE'
          const { chromium } = require(process.env.PROD_PW);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1600,height:900},locale:'ru-RU'});
            await context.addInitScript(() => {
              localStorage.setItem('exchange_token','qa-browser-only');
              localStorage.setItem('exchange_lang','ru');
            });
            await context.route('https://api.voltextech.net/api/v1/me', async route => {
              await route.fulfill({
                status:200,
                contentType:'application/json',
                body:JSON.stringify({id:'qa-browser',displayName:'QA Browser',email:'qa@example.invalid',createdAt:'2026-01-01',isAdmin:false,kycStatus:'NOT_STARTED'})
              });
            });
            const page=await context.newPage();
            const events=[];
            page.on('requestfailed', r=>events.push({kind:'requestfailed',url:r.url(),failure:r.failure()?.errorText||null}));
            page.on('response', r=>{
              const u=r.url();
              if(u.includes('api.voltextech.net')||u.includes('/api/v1/')) events.push({kind:'response',status:r.status(),url:u});
            });
            page.on('console',m=>{if(['error','warning'].includes(m.type()))events.push({kind:'console',type:m.type(),text:m.text().slice(0,500)})});
            page.on('pageerror',e=>events.push({kind:'pageerror',text:String(e.message).slice(0,500)}));
            await page.goto('https://voltextech.net/futures?pair=BTC%2FUSDT',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(15000);
            const body=(await page.locator('body').innerText()).slice(0,5000);
            const chartText=await page.locator('text=Не удалось загрузить график').count();
            const loading=await page.locator('text=Загрузка...').count();
            console.log('URL',page.url());
            console.log('CHART_ERROR_COUNT',chartText);
            console.log('LOADING_COUNT',loading);
            console.log('BODY_SNIP',JSON.stringify(body));
            console.log('EVENTS',JSON.stringify(events,null,2));
            await page.screenshot({path:'/tmp/prod-futures.png',fullPage:false});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "::endgroup::"
          echo "::group::live-frame-validation"
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://api.voltextech.net/api/v1/market/live',{headers:{Origin:'https://voltextech.net',Accept:'text/event-stream'},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error('live HTTP '+response.status);
            const reader=response.body.getReader();const dec=new TextDecoder();let buf='',frame=null;
            while(!frame){
              const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
              const chunks=buf.split('\n\n');buf=chunks.pop()||'';
              for(const chunk of chunks){
                const event=/^event: (.+)$/m.exec(chunk)?.[1];
                const data=/^data: (.+)$/m.exec(chunk)?.[1];
                if(event==='snapshot'&&data){frame=JSON.parse(data);break;}
              }
            }
            reader.cancel().catch(()=>{});
            if(!frame)throw Error('no snapshot');
            console.log('snapshot status',frame.status,'rows',frame.rows?.length,'revision',frame.revision);
            let bad=null;
            for(let i=0;i<frame.rows.length;i++){
              const row=frame.rows[i];
              const reasons=[];
              if(!row||typeof row.id!=='string')reasons.push('id');
              if(row?.id!==`${row?.marketType}:${row?.providerSymbol}`)reasons.push('identity');
              if(typeof row?.baseAsset!=='string')reasons.push('baseAsset');
              if(typeof row?.quoteAsset!=='string')reasons.push('quoteAsset');
              if(typeof row?.stale!=='boolean')reasons.push('stale');
              for(const k of ['lastPrice','changePercent24h','quoteVolume24h']){
                if(row?.[k]!==null&&(typeof row?.[k]!=='number'||!Number.isFinite(row[k])))reasons.push(k);
              }
              if(reasons.length){bad={i,reasons,row};break;}
            }
            console.log('FIRST_INVALID_ROW',JSON.stringify(bad));
            const btc=frame.rows.filter(r=>r.providerSymbol==='BTCUSDT'||r.symbol==='BTC/USDT');
            console.log('BTC_ROWS',JSON.stringify(btc.slice(0,10)));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "::endgroup::"
          echo "::group::browser-ordinary-production"
          PROD_PW=/tmp/prod-browser/node_modules/playwright node <<'NODE'
          const { chromium }=require(process.env.PROD_PW);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1600,height:900},locale:'ru-RU'});
            await context.addInitScript(()=>{localStorage.setItem('exchange_token','qa-browser-only');localStorage.setItem('exchange_lang','ru');});
            await context.route('https://api.voltextech.net/api/v1/me',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({id:'qa-browser',displayName:'QA Browser',email:'qa@example.invalid',createdAt:'2026-01-01',isAdmin:false,kycStatus:'NOT_STARTED'})}));
            await context.route('https://api.voltextech.net/api/v1/private-trading/access',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({allowed:true,mode:'PRIVATE_SIMULATION',nativeAvailable:false,simulationOnly:false})}));
            const page=await context.newPage();const ev=[];
            page.on('response',r=>{const u=r.url();if(u.includes('/candles')||u.includes('/market/live')||u.includes('/private-trading/access'))ev.push({status:r.status(),url:u})});
            page.on('requestfailed',r=>ev.push({failed:r.url(),why:r.failure()?.errorText}));
            await page.goto('https://voltextech.net/futures?pair=BTC%2FUSDT',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(12000);
            console.log('ORDINARY_CHART_ERROR',await page.locator('text=Не удалось загрузить график').count());
            console.log('ORDINARY_MARK_PRICE_TEXT',JSON.stringify((await page.locator('body').innerText()).slice(0,1800)));
            console.log('ORDINARY_EVENTS',JSON.stringify(ev,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "::endgroup::"
          echo "::group::market-live"
          curl -sS -N --compressed --max-time 20 -w '\nTRANSFER_BYTES=%{size_download}\n' -D /tmp/lh -o /tmp/lb -H 'Origin: https://voltextech.net' 'https://api.voltextech.net/api/v1/market/live' || true
          sed -n '1,30p' /tmp/lh || true
          head -c 3000 /tmp/lb || true
          echo
          echo "::endgroup::"
