name: Stocks legacy SQLite unsupported control

# Owner decision 2026-10-20: outside the PG production release contract.
# Keep the original assertions and failing exit status visible. This workflow
# is intentionally independent of the required PostgreSQL release gate.
on:
  pull_request:
    paths:
      - 'services/stocks-global/**'
      - '.github/workflows/stocks-focused-review.yml'
      - '.github/workflows/stocks-legacy-unsupported.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stocks-legacy-unsupported-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  legacy-unsupported:
    name: Unsupported SQLite revocation — known defect (expected 401, actual 200)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unchanged legacy assertions (real failure is retained)
        id: legacy
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap services/stocks-global/two-trader-auth-lifetime.test.mjs | tee legacy-unsupported.tap
      - name: Report actual legacy result independently of PG release
        if: always()
        env:
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
        run: |
          echo "## Unsupported SQLite trading: $LEGACY_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Known pre-COMMIT revocation defect: expected 401, observed 200. No assertion was changed." >> "$GITHUB_STEP_SUMMARY"
          echo "This job keeps its failing exit status; it is not part of the PostgreSQL production contract." >> "$GITHUB_STEP_SUMMARY"
          if test -f legacy-unsupported.tap; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat legacy-unsupported.tap >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-legacy-unsupported-${{ github.sha }}
          path: legacy-unsupported.tap
          if-no-files-found: error
