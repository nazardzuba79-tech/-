name: Stocks source proof and admission
on:
  pull_request:
    paths:
      - 'scripts/stocks-*-clmm-*.mjs'
      - 'research/solana-xstocks/proof-615-20261025/**'
      - 'frontend/src/lib/__tests__/stocksSourceAdmission.test.ts'
      - '.github/workflows/stocks-source-proof.yml'
permissions:
  contents: read
jobs:
  offline-proof:
    name: Offline CLMM proof (52 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: node --test scripts/stocks-verify-clmm-proof.test.mjs scripts/stocks-reconcile-clmm-receipts.test.mjs
  source-admission:
    name: Source admission (unimplemented acceptance gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npx --no-install jest --runInBand frontend/src/lib/__tests__/stocksSourceAdmission.test.ts
