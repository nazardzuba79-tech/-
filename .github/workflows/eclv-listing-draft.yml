name: ECLAVO November 6 private-draft update QA

on:
  pull_request:
    paths:
      - 'config/test-markets/eclv-20261103.draft.json'
      - 'config/test-markets/eclv-20261103.logo.png'
      - 'src/services/listings/__tests__/eclvDraft.test.ts'
      - 'src/services/testMarkets/simulationScenarioControls.ts'
      - 'src/shared/listingScenarioControls.ts'
      - 'frontend/src/pages/admin/listingMovementModel.ts'
      - 'frontend/src/lib/__tests__/listingMovementControls.test.ts'
      - 'scripts/qa-listing-eclv.cjs'
      - 'scripts/eclv-draft-import.cjs'
      - 'scripts/eclv-draft-import.test.cjs'
      - 'scripts/qa-eclv-api-backport.cjs'
      - 'ops/listings/eclv-peak-89c3.patch'
      - 'docs/ECLV_LISTING_20261103.md'
      - '.github/workflows/eclv-listing-draft.yml'

permissions:
  contents: read

jobs:
  eclv-candidate:
    # Runs for Draft and ready PRs alike, never for a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Private-draft update CAS, identity, publication and idempotency guards
        run: node --test scripts/eclv-draft-import.test.cjs
      - name: Verify next listing candidate and previous TYVN scenario regression
        run: |
          npx jest --runInBand --silent --runTestsByPath \
            src/services/listings/__tests__/eclvDraft.test.ts \
            src/services/listings/__tests__/qvtrDraft.test.ts \
            frontend/src/lib/__tests__/listingMovementControls.test.ts \
            src/services/listings/__tests__/tyvnDraft.test.ts \
            src/services/listings/__tests__/listingCountdown.test.ts \
            src/services/listings/__tests__/listingScenarioControls.test.ts
      - name: Confirm public configuration cannot place orders or allocate funds
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), assert = require('assert/strict');
          const c = JSON.parse(fs.readFileSync('config/test-markets/eclv-20261103.draft.json','utf8'));
          assert.equal(c.tradable, false);
          assert.equal(c.ownerAllocation, '0');
          assert.equal(c.symbol, 'ECLV');
          assert.equal(c.listingAt, '2026-11-06T13:00:00Z');
          assert.equal(c.simulationProgram.maxPrice, '1.01472');
          assert.equal(c.simulationProgram.stages.at(-1).targetPrice, '1.01472');
          assert.equal(c.seed, 'eclavo-20261103-v1');
          assert.equal(c.simulationProgram.kind,'scenario-controls-v2');
          assert.notEqual(c.simulationProgram.afterGrowth,'historical');
          assert(c.logo.startsWith('data:image/png;base64,'));
          console.log('ECLV candidate no trading, no automatic credit, no publication or deployment');
          NODE

  eclv-browser:
    # Local, disposable: Worker in workerd + this checkout's admin router + production bundle in Chromium. No secrets, no network calls out.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JWT_SECRET: ci-only-eclv-listing-qa-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix workers/market-edge --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Production bundle pointed at the local Worker
        run: cd frontend && npx vite build --outDir ../.eclv-qa-dist --emptyOutDir
        env:
          VITE_MARKET_EDGE_URL: http://127.0.0.1:8787
      - name: Install browser
        run: |
          npm install --prefix /tmp/eclv-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/eclv-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Form and API import, duplicates and seed, preview, local staged publish and timer, exchange 1440/390, Spot search, after-opening chart
        run: node scripts/qa-listing-eclv.cjs
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/eclv-qa/node_modules/playwright
          QA_FRONTEND_DIST: .eclv-qa-dist
          QA_OUT: /tmp/eclv-qa-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclv-listing-qa
          path: /tmp/eclv-qa-report
          retention-days: 14


  eclv-production-api-source-compat:
    # Compile the observed production API base + TWO-FILE patch. Never deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate the observed production source, without main/History20 overlays
        run: |
          git fetch origin 89c3ac003b44a6a0e7630d2ecbe5d7164e85b683 --depth=1
          git worktree add --quiet --detach "$RUNNER_TEMP/eclv-production-api" 89c3ac003b44a6a0e7630d2ecbe5d7164e85b683
          git -C "$RUNNER_TEMP/eclv-production-api" apply "$GITHUB_WORKSPACE/ops/listings/eclv-peak-89c3.patch"
          git -C "$RUNNER_TEMP/eclv-production-api" diff --name-only > "$RUNNER_TEMP/eclv-production-api-files.txt"
          python3 - <<'PY'
          import os,pathlib
          changed=pathlib.Path(os.environ['RUNNER_TEMP'],'eclv-production-api-files.txt').read_text().splitlines()
          assert set(changed)=={'src/shared/listingScenarioControls.ts','src/services/testMarkets/simulationScenarioControls.ts'},changed
          print('Only two synthetic-scenario files changed on the observed production API base')
          PY
      - name: Install the production base lockfile, generate client without DB access, build API
        run: |
          cd "$RUNNER_TEMP/eclv-production-api"
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npm run build
      - name: Actual cap, retained seed, guards and prior-path fingerprint on the patched production source
        run: node scripts/qa-eclv-api-backport.cjs "$RUNNER_TEMP/eclv-production-api" > .eclv-api-backport-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclv-production-api-source-compat
          path: .eclv-api-backport-result.json
