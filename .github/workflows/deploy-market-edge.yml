name: Verify / deploy voltex-market-edge (Cloudflare Worker)

# Verifies every change on the isolated branch.
# Deploys ONLY when the commit explicitly contains [deploy-market-edge],
# or when manually started after the workflow exists on the default branch.
on:
  push:
    branches: [cloudflare-market-edge]
    paths:
      - 'workers/market-edge/**'
      - '.github/workflows/deploy-market-edge.yml'
  pull_request:
    paths:
      - 'workers/market-edge/**'
      - 'frontend/src/lib/sampledDepth.ts'
      - 'frontend/src/lib/futuresDepth.ts'
      - 'frontend/src/pages/FuturesPage.tsx'
      - '.github/workflows/deploy-market-edge.yml'
  workflow_dispatch:

concurrency:
  group: market-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/market-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker contract and isolation tests
        run: node --experimental-default-type=module test.mjs
      - name: Wrangler dry-run
        run: npx --yes wrangler@4 deploy --dry-run

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-market-edge]'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/market-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c379227476dedde6dff09c787ffdb510
      - name: Health check
        run: curl -fsS https://market.voltextech.net/health


  live-smoke:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployed Worker health
        run: |
          curl -fsS https://market.voltextech.net/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.ok!==true||j.service!=='voltex-market-edge')process.exit(1)})"
      - name: Confirm deployed Futures book contract
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS https://market.voltextech.net/market/display/futures-book/BTCUSDT -o /tmp/book.json; then
              if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/book.json','utf8'));if(j.available!==true||j.symbol!=='BTCUSDT'||!Array.isArray(j.bids)||!Array.isArray(j.asks)||j.bids.length<1||j.asks.length<1||j.bids.length>25||j.asks.length>25)process.exit(1)"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "market-edge Futures book did not become healthy" >&2
          exit 1
