name: Full frontend regression
'on':
  push:
    branches:
      - codex/release-qa-validation-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-validation-20261006-frontend-full-suite.yml
  cancel-in-progress: false
jobs:
  complete-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'postgresql://test:test@127.0.0.1:9/frontend_test_unused'
      DIRECT_URL: 'postgresql://test:test@127.0.0.1:9/frontend_test_unused'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9866714f1541bb878eb1aa01176d6ac97059b177
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = '9866714f1541bb878eb1aa01176d6ac97059b177'
          echo 'RELEASE_QA_SOURCE_SHA=9866714f1541bb878eb1aa01176d6ac97059b177'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck and build the current frontend before CSS artifact assertions
        run: npm run build --prefix frontend
      - name: 'Every frontend suite, with no baseline-failure waiver'
        run: |
          mkdir -p .ci-output
          node node_modules/jest/bin/jest.js frontend/src --runInBand --json --outputFile=.ci-output/frontend-full.json
      - name: Reject skipped or unfinished frontend checks
        run: >-
          node -e "const r=require('./.ci-output/frontend-full.json'); if(r.numPendingTests || r.numTodoTests) throw new
          Error('Full frontend gate requires every check to run'); if(!r.numPassedTests || !r.success) throw new
          Error('Full frontend gate did not pass'); console.log(r.numPassedTests + ' frontend checks passed, none
          skipped');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-frontend-regression
          path: .ci-output/frontend-full.json
          if-no-files-found: warn
          retention-days: 7
