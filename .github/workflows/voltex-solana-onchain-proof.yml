name: VOLTEX Solana xStocks one-shot on-chain evidence
'on':
  push:
    branches:
      - codex/solana-xstocks-onchain-proof-20261024
    paths:
      - .github/workflows/voltex-solana-onchain-proof.yml
permissions:
  contents: read
jobs:
  finalized-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Bounded read-only Raydium CLMM proof for AAPLx and TSLAx
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const clmm='CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK';
          const usdc='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
          const pairs=[
            ['AAPLx','CKwJZwm7oj3nu4653N1EpDrqXbXAYXoPFiPeEnLouF8y','XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp'],
            ['TSLAx','8aDaBQkTrS6HVMjyc6EZebgdiaXhLYGriDWKWWp1NpFF','XsDoVfqeBukxuZHWhdvWHBhgEHjGNst4MLodqsJHzoB']
          ];
          const abc='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const b58=b=>{let n=0n;for(const v of b)n=n*256n+BigInt(v);let out='';while(n){out=abc[Number(n%58n)]+out;n/=58n;}let z=0;for(const v of b){if(v)break;z++;}return '1'.repeat(z)+out;};
          const disc=s=>createHash('sha256').update(s).digest().subarray(0,8);
          const pd=disc('account:PoolState'),sd=disc('event:SwapEvent');
          let id=0;
          async function rpc(method,params){
            if(!['getAccountInfo','getSignaturesForAddress','getTransaction'].includes(method))throw Error('FORBIDDEN_METHOD');
            const r=await fetch('https://api.mainnet.solana.com',{method:'POST',redirect:'error',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method,params}),signal:AbortSignal.timeout(7000)});
            if(!r.ok)throw Error('RPC_HTTP_'+r.status);
            const text=await r.text();if(text.length>1600000)throw Error('RPC_TOO_LARGE');
            const obj=JSON.parse(text);if(obj.error)throw Error('RPC_'+obj.error.code);return obj.result;
          }
          const results=[];
          for(const [ticker,pool,mint] of pairs){
            const evidence={ticker,pool,chartReady:false,issuerMultiplierVerified:false,status:'NOT_VERIFIED',swaps:0};
            try{
              const a=(await rpc('getAccountInfo',[pool,{encoding:'base64',commitment:'finalized'}]))?.value;
              if(a?.owner!==clmm)throw Error('POOL_OWNER_MISMATCH');
              const raw=Buffer.from(a?.data?.[0]||'','base64');
              if(raw.length<235||!raw.subarray(0,8).equals(pd))throw Error('POOL_LAYOUT_MISMATCH');
              const m=[b58(raw.subarray(73,105)),b58(raw.subarray(105,137))];
              if(m[0]===m[1]||!m.includes(mint)||!m.includes(usdc))throw Error('POOL_MINT_MISMATCH');
              evidence.poolVerified=true;evidence.mints=m;
              const rows=await rpc('getSignaturesForAddress',[pool,{limit:4,commitment:'finalized'}]);
              if(!Array.isArray(rows))throw Error('INVALID_SIGNATURE_RESPONSE');
              evidence.signatureCount=rows.length;
              for(const row of rows){
                if(row?.err!==null||!row.signature||!Number.isSafeInteger(row.slot))continue;
                const tx=await rpc('getTransaction',[row.signature,{encoding:'json',commitment:'finalized',maxSupportedTransactionVersion:1}]);
                if(tx?.meta?.err!==null||tx?.slot!==row.slot)continue;
                const stack=[];
                for(const log of tx.meta.logMessages??[]){
                  const up=log.match(/^Program ([1-9A-HJ-NP-Za-km-z]{32,44}) invoke \[(\d+)\]$/);
                  if(up){stack.push(up[1]);continue;}
                  const end=log.match(/^Program ([1-9A-HJ-NP-Za-km-z]{32,44}) (?:success|failed:.*)$/);
                  if(end){stack.pop();continue;}
                  if(stack.at(-1)!==clmm||!log.startsWith('Program data: '))continue;
                  const bytes=Buffer.from(log.slice(14).trim(),'base64');
                  if(bytes.length===221&&bytes.subarray(0,8).equals(sd)&&b58(bytes.subarray(8,40))===pool){
                    evidence.swaps++;evidence.sampleSignature??=row.signature;evidence.sampleBlockTime=tx.blockTime;
                  }
                }
              }
              evidence.status=evidence.swaps?'FINALIZED_SWAPS_FOUND':'POOL_VERIFIED_NO_SWAP_IN_BOUNDED_SAMPLE';
            }catch(err){evidence.error=String(err.message).slice(0,120);}
            results.push(evidence);
          }
          console.log(JSON.stringify({utc:new Date().toISOString(),readOnly:true,sampledOnly:true,notCompleteOHLCV:true,results},null,2));
          if(results.some(x=>x.status!=='FINALIZED_SWAPS_FOUND'))process.exitCode=2;
          NODE
