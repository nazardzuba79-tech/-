name: Copy Futures demo source provenance (read-only)
on:
  pull_request:
    paths:
      - 'src/services/copyTrading/FuturesDemoSource.ts'
      - 'src/services/copyTrading/__tests__/FuturesDemoSource.test.ts'
      - '.github/workflows/copy-futures-demo-source.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npx jest --runInBand src/services/copyTrading/__tests__/FuturesDemoSource.test.ts
