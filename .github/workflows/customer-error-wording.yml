name: Customer-facing error wording

on:
  pull_request:
    paths:
      - 'frontend/src/lib/customerError.ts'
      - 'frontend/src/lib/futuresOrderErrors.ts'
      - 'frontend/src/lib/privateTradingApi.ts'
      - 'frontend/src/lib/i18n/locales/**'
      - 'frontend/src/components/**'
      - 'frontend/src/pages/**'
      - 'scripts/qa-customer-error-wording.cjs'
      - '.github/workflows/customer-error-wording.yml'
      - '.github/scripts/verify-ci-browser.cjs'

permissions:
  contents: read

concurrency:
  group: customer-error-wording-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wording:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        shell: bash
    # Twenty customer screens in six states (three of them network failures,
    # one answering after 8 s) take about eleven minutes of browser time.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Injected server junk and preserved business refusals
        run: npx jest frontend/src/lib/__tests__/customerFacingErrors.test.ts
      - name: Frontend TypeScript and production bundle
        run: npm run build --prefix frontend
      - name: Disposable browser tooling
        run: |
          npm install --prefix /tmp/wording-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node .github/scripts/verify-ci-browser.cjs /tmp/wording-browser/node_modules/playwright 1.63.0 preinstalled
          # The author harnesses in this repository resolve playwright from
          # this absolute path. Supply it only in the disposable runner.
          mkdir -p /opt/node22/lib/node_modules
          ln -s /tmp/wording-browser/node_modules/playwright /opt/node22/lib/node_modules/playwright
      - name: Twenty customer screens, normal / failing / partial / offline / timeout / slow
        run: node scripts/qa-customer-error-wording.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-error-wording-${{ github.sha }}
          path: /tmp/qa-customer-error-wording
          retention-days: 7
          if-no-files-found: warn
