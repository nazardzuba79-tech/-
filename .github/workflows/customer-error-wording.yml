name: Customer-facing error wording

on:
  pull_request:
    paths:
      - 'frontend/src/lib/customerError.ts'
      - 'frontend/src/lib/futuresOrderErrors.ts'
      - 'frontend/src/lib/privateTradingApi.ts'
      - 'frontend/src/lib/i18n/locales/**'
      - 'frontend/src/components/**'
      - 'frontend/src/pages/**'
      - 'scripts/qa-customer-error-wording.cjs'
      - '.github/workflows/customer-error-wording.yml'

permissions:
  contents: read

concurrency:
  group: customer-error-wording-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wording:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Injected server junk and preserved business refusals
        run: npx jest frontend/src/lib/__tests__/customerFacingErrors.test.ts
      - name: Frontend TypeScript and production bundle
        run: npm run build --prefix frontend
      - name: Disposable browser tooling
        run: |
          npm install --prefix /tmp/wording-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/wording-browser/node_modules/playwright/cli.js install --with-deps chromium
          # The author harnesses in this repository resolve playwright from
          # this absolute path. Supply it only in the disposable runner.
          sudo mkdir -p /opt/node22/lib/node_modules
          sudo ln -s /tmp/wording-browser/node_modules/playwright /opt/node22/lib/node_modules/playwright
      - name: Five customer screens, normal / failing / partial
        run: node scripts/qa-customer-error-wording.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-error-wording-${{ github.sha }}
          path: /tmp/qa-customer-error-wording
          retention-days: 7
          if-no-files-found: warn
