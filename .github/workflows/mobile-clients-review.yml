# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Mobile clients isolated review
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-20261006-mobile-clients-review.yml
  cancel-in-progress: false
jobs:
  fixtures-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: node scripts/mobile-review-ci-safety.cjs
      - run: node scripts/mobile-review-checks.cjs
      - name: Frontend typecheck and normal bundle isolation
        run: npm run build --prefix frontend
      - name: Isolated mobile bundle
        working-directory: frontend
        run: node node_modules/vite/bin/vite.js build --config vite.mobile-review.config.ts
      - name: Disposable browser tooling
        run: >
          npm install --prefix /tmp/mobile-review-tools --no-save --ignore-scripts --no-audit --no-fund
          playwright@1.63.0

          node /tmp/mobile-review-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Local browser fixtures and offline checks
        env:
          MOBILE_REVIEW_PLAYWRIGHT: /tmp/mobile-review-tools/node_modules/playwright
        run: node scripts/qa-mobile-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review-evidence
          path: output/mobile-review/
          retention-days: 7
