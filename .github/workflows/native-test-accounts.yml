# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Native test account access
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
jobs:
  test-account-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
          persist-credentials: false
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Backend TypeScript
        run: npm run build
      - name: 'Actual native tester access, ledger and isolation regressions'
        run: >-
          npm test -- --runInBand --json --outputFile=native-test-accounts.json --runTestsByPath
          src/private-trading/__tests__/nativeTestAccounts.test.ts src/api/routes/__tests__/nativeDemoAccess.test.ts
          src/private-trading/__tests__/simulationOnlyIsolation.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-account-results
          path: native-test-accounts.json
concurrency:
  group: release-qa-20261006-native-test-accounts.yml
  cancel-in-progress: false
