name: TEMP sampled display branch assembly
on:
  push:
    branches: ['chatgpt/sampled-display-budget']
    paths:
      - 'scripts/reconcile-sampled-display-temp.py'
      - 'scripts/visibility-sampled-display-temp.py'
      - '.github/workflows/sampled-display-assemble-temp.yml'
permissions:
  contents: write
concurrency:
  group: sampled-display-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'nazardzuba79-tech/-' && github.ref == 'refs/heads/chatgpt/sampled-display-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sampled-display-budget
      - name: Apply reviewed source fixes, never edit workflows with the runner token
        run: |
          set -euo pipefail
          : > /tmp/sampled-display-changed.txt
          if ! grep -q '^export function displayRefreshDelay' frontend/src/lib/displaySnapshotCache.ts; then
            python3 scripts/reconcile-sampled-display-temp.py
          fi
          python3 scripts/visibility-sampled-display-temp.py
          while IFS= read -r path || test -n "$path"; do
            case "$path" in src/*|frontend/src/*|scripts/qa-*.cjs|scripts/serve-native-demo-review.cjs) git add -- "$path" ;; *) echo "Unexpected source target: $path"; exit 1 ;; esac
          done < /tmp/sampled-display-changed.txt
          if ! git diff --cached --quiet; then
            git config user.name 'VOLTEX display assembly'
            git config user.email 'noreply@users.noreply.github.com'
            git commit -m '[CF-Pages-Skip] Apply reviewed sampled-display persistence and compatibility fixes'
            git push origin HEAD:refs/heads/chatgpt/sampled-display-budget
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund && npm ci --prefix frontend --ignore-scripts --no-audit --no-fund && npx prisma generate
      - name: Build backend and frontend
        run: npm run build && npm run build --prefix frontend
      - name: Request budget, cache persistence, UI and isolation regressions
        run: >-
          npx jest --runInBand --silent --runTestsByPath
          src/api/routes/__tests__/sampledDisplayBudget.test.ts
          frontend/src/lib/__tests__/homeHeroVisibility.test.ts
          frontend/src/lib/__tests__/cfdTerminal.test.ts
          frontend/src/lib/__tests__/cfdDisplayOnly.test.ts
          frontend/src/lib/__tests__/futuresUiPolish.test.ts
          frontend/src/lib/__tests__/copyTradingCiCoverage.test.ts
          frontend/src/lib/__tests__/i18nLanguageChunks.test.ts
          frontend/src/lib/__tests__/futuresColdOpenRecovery.test.ts
          frontend/src/lib/__tests__/homeLiveMarket.test.ts
          frontend/src/lib/__tests__/homeMarketSnapshot.test.ts
          frontend/src/lib/__tests__/homeHeroStream.test.ts
          src/services/marketData/live/__tests__/CollectorDepthRouting.test.ts
          src/services/marketData/live/__tests__/LiveTransport.test.ts
          src/api/routes/__tests__/marketLiveGzip.test.ts
          src/private-trading/__tests__/math.test.ts
          src/private-trading/__tests__/liveEngine.test.ts
      - name: Install disposable browser
        run: |
          npm install --prefix /tmp/voltex-browser playwright@1.63.0 --no-audit --no-fund
          ln -s /tmp/voltex-browser/node_modules/playwright node_modules/playwright
          /tmp/voltex-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Futures desktop and mobile
        id: futures
        continue-on-error: true
        run: node scripts/qa-futures-visual-polish.cjs --widths 1440x900,390x844 --out /tmp/sampled-browser --label sampled
      - name: Homepage first paint
        id: home
        continue-on-error: true
        env:
          HOME_QA_PLAYWRIGHT: /tmp/voltex-browser/node_modules/playwright
        run: node scripts/qa-home-laptop-first-load.cjs
      - name: Homepage six-hour snapshot on reload
        id: reload
        continue-on-error: true
        env:
          HOME_QA_PLAYWRIGHT: /tmp/voltex-browser/node_modules/playwright
        run: node scripts/qa-home-snapshot-reload.cjs
      - name: CFD candles, paper orders and cached reload
        id: cfd
        continue-on-error: true
        env:
          CFD_QA_PLAYWRIGHT: /tmp/voltex-browser/node_modules/playwright
        run: node scripts/qa-cfd-display-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sampled-display-acceptance
          path: |
            /tmp/sampled-browser
            docs/qa/home-laptop-first-load/
            docs/qa/home-snapshot-reload/
            docs/qa/cfd-display-browser/
          retention-days: 3
      - name: Require every browser result
        if: always()
        env:
          FUTURES: ${{ steps.futures.outcome }}
          HOME: ${{ steps.home.outcome }}
          RELOAD: ${{ steps.reload.outcome }}
          CFD: ${{ steps.cfd.outcome }}
        run: |
          printf 'futures=%s home=%s reload=%s cfd=%s\n' "$FUTURES" "$HOME" "$RELOAD" "$CFD"
          test "$FUTURES" = success && test "$HOME" = success && test "$RELOAD" = success && test "$CFD" = success
