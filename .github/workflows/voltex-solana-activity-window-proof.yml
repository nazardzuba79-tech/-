name: VOLTEX xStocks seven pool activity and chart feasibility sample
'on':
  push:
    branches:
      - codex/solana-xstocks-seven-pool-proof-20261024
    paths:
      - .github/workflows/voltex-solana-activity-window-proof.yml
permissions:
  contents: read
jobs:
  read-only-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Bounded 7-pool finalized signature density (NOT full swap volume)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const pairs=[
          ['AAPLx','CKwJZwm7oj3nu4653N1EpDrqXbXAYXoPFiPeEnLouF8y'],
          ['TSLAx','8aDaBQkTrS6HVMjyc6EZebgdiaXhLYGriDWKWWp1NpFF'],
          ['NVDAx','4KqQN6u1pFKroFE2jVEhoepAMRKPcuAzWVDCgm9zRBYN'],
          ['SPYx','6truu3rZuiB9rKQg4VYC3Dt3QwV7DgwGqXrYUcrvnDDE'],
          ['GOOGLx','B8YAwjGYk6qidWzGBXMAxP7nYfG8g74EZ3Y4gFSsobRw'],
          ['MSTRx','RyhF4cksVZY7vcqJpoytHcxcGNKRp27PEGhSnEPpbGv'],
          ['QQQx','FknDV1F5n6QaA7rLmjquDjuU6wcPMNm5RYq7zWbqhpZw']
          ];
          const end=Math.floor(Date.now()/60000)*60-120,begin=end-3600;
          let seq=0;const results=[];
          for(const [ticker,pool] of pairs){
           const out={ticker,pool,windowStartUTC:new Date(begin*1000).toISOString(),windowEndUTC:new Date(end*1000).toISOString(),
             scope:'finalized pool-address signatures, including NON-trades',notSwaps:true,notCompleteHistory:true};
           try{
             const response=await fetch('https://api.mainnet.solana.com',{method:'POST',redirect:'error',signal:AbortSignal.timeout(9000),headers:{'content-type':'application/json'},
               body:JSON.stringify({jsonrpc:'2.0',id:++seq,method:'getSignaturesForAddress',params:[pool,{limit:100,commitment:'finalized'}]})});
             if(!response.ok)throw Error('HTTP_'+response.status);
             const data=await response.json();if(data.error)throw Error('RPC_'+data.error.code);
             const xs=data.result;
             if(!Array.isArray(xs)||xs.length>100||xs.some(x=>!Number.isSafeInteger(x.blockTime)||!Number.isSafeInteger(x.slot)))throw Error('INVALID_SIG_PAGE');
             for(let i=1;i<xs.length;i++)if(xs[i].slot>xs[i-1].slot)throw Error('NOT_DESCENDING');
             out.signatureCount=xs.length;out.earliestSampleUTC=xs.length?new Date(xs.at(-1).blockTime*1000).toISOString():null;
             out.mostRecentSampleUTC=xs.length?new Date(xs[0].blockTime*1000).toISOString():null;
             out.coversFullHour=xs.length>0&&xs.at(-1).blockTime<begin;
             const inHour=xs.filter(x=>x.blockTime>=begin&&x.blockTime<end);
             out.signatureCountInHour=inHour.length;
             out.minutesWithAnySignature=new Set(inHour.map(x=>Math.floor(x.blockTime/60))).size;
             out.lastHourCoveragePct=out.coversFullHour?Math.round(100*out.minutesWithAnySignature/60):null;
             out.status=out.coversFullHour?'COMPLETE_HOUR_SIGNATURE_SAMPLE_ONLY':'HOUR_NOT_PROVED';
           }catch(e){out.error=String(e.message).slice(0,100);out.status='NOT_VERIFIED';}
           results.push(out);await new Promise(r=>setTimeout(r,1200));
          }
          console.log(JSON.stringify({utc:new Date().toISOString(),readOnly:true,rateLimitedFreeRpc:true,results},null,2));
          // Exploratory metrics; only actual RPC/identity errors make the test fail.
          if(results.some(x=>x.status==='NOT_VERIFIED'))process.exitCode=2;
          NODE
