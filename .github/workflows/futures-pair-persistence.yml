# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Futures pair persistence and header cluster
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-20261006-futures-pair-persistence.yml
  cancel-in-progress: false
jobs:
  pair-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Unit and source guards
        run: >-
          npx jest frontend/src/lib/__tests__/futuresPairPersistence.test.ts
          frontend/src/lib/__tests__/futuresMarketSearch.test.ts frontend/src/lib/__tests__/futuresFinalPolish.test.ts
          frontend/src/lib/__tests__/futuresUiPolish.test.ts frontend/src/lib/__tests__/orderPanelNavCleanup.test.ts
          frontend/src/lib/__tests__/i18nLanguageChunks.test.ts frontend/src/lib/__tests__/futuresTickerHeader.test.ts
          frontend/src/lib/__tests__/futuresMarketStats.test.ts frontend/src/lib/__tests__/terminalPresentation.test.ts
      - name: Frontend TypeScript and production bundle
        run: npm run build --prefix frontend
      - name: Disposable browser tooling
        run: >
          npm install --prefix /tmp/pair-persistence-browser --no-save --ignore-scripts --no-audit --no-fund
          playwright@1.63.0

          node /tmp/pair-persistence-browser/node_modules/playwright/cli.js install --with-deps chromium

          # The original author harness uses this absolute module path.

          # Supply it only in the disposable runner; production is untouched.

          sudo mkdir -p /opt/node22/lib/node_modules

          sudo ln -s /tmp/pair-persistence-browser/node_modules/playwright /opt/node22/lib/node_modules/playwright
      - name: 'Refresh, ticker click and header cluster at 1440 and 390'
        run: node scripts/qa-futures-pair-persistence.cjs --label ci
      - name: 'Header turnover, open-interest contrast and the profile menu at 1920 and 1440'
        env:
          QA_LABEL: after
          QA_OUT: docs/qa/futures-pair-persistence/ci-header-turnover
        run: node scripts/qa-futures-header-turnover.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'futures-pair-persistence-${{ github.sha }}'
          path: docs/qa/futures-pair-persistence/ci-*
          retention-days: 7
          if-no-files-found: warn
