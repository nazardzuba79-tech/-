name: Verify copy locked catalogue final
on:
  push:
    branches:
      - codex/copy-trading-locked-list
    paths:
      - .github/workflows/verify-copy-locked-final.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify fresh main
        shell: bash
        run: |
          git fetch origin main codex/copy-trading-locked-list
          test "$(git rev-parse origin/main)" = "54a410ef52c8c50932d95b53e90d5d88446cd165"
      - name: Frontend production build
        shell: bash
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
          git diff --check
      - name: Remove one-shot verifier
        shell: bash
        run: |
          git rm .github/workflows/verify-copy-locked-final.yml
          git config user.name "VOLTEX copy QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-shot copy catalogue verifier"
          git push origin HEAD:refs/heads/codex/copy-trading-locked-list
