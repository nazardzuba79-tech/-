name: Native demo reviewed source transfer
on:
  push:
    branches: ['codex/private-cross-demo-bybit-model']
    paths: ['.github/workflows/native-demo-source-transfer.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'nazardzuba79-tech/-' && github.ref == 'refs/heads/codex/private-cross-demo-bybit-model'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MAIN: 54a410ef52c8c50932d95b53e90d5d88446cd165
      BRANCH: codex/private-cross-demo-bybit-model
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse branch drift or newer main
        run: |
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
      - name: Decode exact reviewed patch without executing its code
        run: |
          node <<'NODE'
          const fs = require('fs'), zlib = require('zlib'), crypto = require('crypto');
          const encoded = Array.from({length:7}, (_,i) => fs.readFileSync(`scripts/.native-transfer-${String(i+1).padStart(2,'0')}.b64`,'utf8')).join('');
          const patch = zlib.brotliDecompressSync(Buffer.from(encoded,'base64'));
          if (crypto.createHash('sha256').update(patch).digest('hex') !== '35a842a0b5b60884046d91068b35f49d190ba80d598eac5b7602858406476926') throw Error('Payload mismatch');
          const allowed = new Set(['frontend/src/components/PrivateTradingEntry.tsx','frontend/src/lib/nativeDemoApi.ts','frontend/src/pages/FuturesPage.tsx','frontend/src/pages/FuturesRoute.tsx','frontend/src/pages/private-trading/NativeDemoControls.tsx','frontend/src/pages/private-trading/PrivateResultCardDialog.tsx','frontend/src/pages/private-trading/nativeDemo.css','frontend/src/pages/private-trading/useNativeDemo.tsx','prisma/migrations/20260914180000_native_demo_account/migration.sql','prisma/schema.prisma','scripts/serve-native-demo-review.cjs','src/api/routes/privateTrading.ts','src/private-trading/__tests__/nativeDemoEngine.test.ts','src/private-trading/marketData.ts','src/private-trading/native/engine.ts','src/private-trading/native/replay.ts','src/private-trading/native/routes.ts','src/private-trading/native/service.ts','src/private-trading/native/store.ts']);
          const paths = [...patch.toString('utf8').matchAll(/^diff --git a\/(\S+) b\/(\S+)$/gm)];
          if(paths.length !== allowed.size || paths.some(m => m[1] !== m[2] || !allowed.has(m[1]))) throw Error('Unexpected paths');
          fs.writeFileSync('/tmp/native-demo.patch', patch);
          NODE
          git apply --check --index /tmp/native-demo.patch
          git apply --index /tmp/native-demo.patch
          git rm scripts/.native-transfer-*.b64
      - name: Preserve newer changes and push only this review branch
        run: |
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          git config user.name 'VOLTEX reviewed-source transport'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement native private cross-margin demo inside existing futures terminal'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
