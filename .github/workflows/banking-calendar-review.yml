name: Banking calendar and referral settlement (disposable PostgreSQL)
on:
  pull_request:
    paths:
      - 'src/banking/**'
      - 'prisma/**'
      - '.github/workflows/banking-calendar-review.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: banking-calendar-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The real clock plus the days a "one month ago" fixture breaks on (Issue #654):
        # the 31st after a 30-day month, a 30th, February in a common and a leap year,
        # 31 March after February, the year boundary and the last second of a day.
        now: ['', '2026-10-31', '2026-11-30', '2027-02-28', '2028-02-29', '2028-03-31', '2027-01-01T00:00:00Z', '2026-10-31T23:59:59Z']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: banking_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/banking_ci
      DIRECT_URL: postgresql://postgres:fixture@127.0.0.1:5432/banking_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate && npx prisma migrate deploy && npx tsc --noEmit -p .
      - name: Calendar rule tables (28th–31st, February, leap years, year boundary, four time zones)
        run: npx jest --runInBand --runTestsByPath src/banking/__tests__/calendarFixture.test.ts src/banking/__tests__/math.test.ts
      - name: Referral settlement on PostgreSQL at BANKING_TEST_NOW=${{ matrix.now || 'real clock' }}
        env:
          BANKING_DB_TESTS: '1'
          BANKING_TEST_NOW: ${{ matrix.now }}
        run: npx jest --runInBand --runTestsByPath src/banking/__tests__/bankingReferral.integration.test.ts
