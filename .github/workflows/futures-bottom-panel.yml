name: Futures bottom panel geometry
'on':
  push:
    branches:
      - codex/release-qa-validation-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-validation-20261006-futures-bottom-panel.yml
  cancel-in-progress: false
jobs:
  bottom-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9866714f1541bb878eb1aa01176d6ac97059b177
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = '9866714f1541bb878eb1aa01176d6ac97059b177'
          echo 'RELEASE_QA_SOURCE_SHA=9866714f1541bb878eb1aa01176d6ac97059b177'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Frontend TypeScript and production bundle
        run: npm run build --prefix frontend
      - name: Disposable browser tooling
        run: >
          npm install --prefix /tmp/bottom-panel-browser --no-save --ignore-scripts --no-audit --no-fund
          playwright@1.63.0

          node /tmp/bottom-panel-browser/node_modules/playwright/cli.js install --with-deps chromium

          # The original author harness uses this absolute module path.

          # Supply it only in the disposable runner; production is untouched.

          sudo mkdir -p /opt/node22/lib/node_modules

          sudo ln -s /tmp/bottom-panel-browser/node_modules/playwright /opt/node22/lib/node_modules/playwright
      - name: 'Empty and filled panel, all tabs, four desktop widths'
        run: node scripts/qa-futures-bottom-panel.cjs --label ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'futures-bottom-panel-integrated-${{ github.sha }}'
          path: docs/qa/futures-bottom-panel/ci-*
          retention-days: 7
          if-no-files-found: warn
