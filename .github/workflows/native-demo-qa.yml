name: Native demo engine and browser
on:
  pull_request:
    paths:
      - 'src/private-trading/**'
      - 'src/api/routes/**'
      - 'frontend/src/**'
      - 'prisma/**'
      - 'scripts/*native-demo*'
      - 'scripts/qa-large-numbers-browser.cjs'
      - 'jest.config.js'
      - '.github/workflows/native-demo-qa.yml'
permissions:
  contents: read
concurrency:
  group: native-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Backend and collector TypeScript
        run: npm run build && npx tsc -p tsconfig.collector.json
      - name: Production frontend TypeScript and bundle
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: /api/v1
      - name: Exact reduce-only target and command regressions
        run: npm test -- --runInBand --json --outputFile=native-target-tests.json --runTestsByPath frontend/src/lib/__tests__/nativeReduceTarget.test.ts
      - name: Native math and authorization tests
        run: npm test -- --runInBand --json --outputFile=native-tests.json --runTestsByPath src/private-trading/__tests__/nativeDemoEngine.test.ts src/private-trading/__tests__/nativeDemoReplay.test.ts src/private-trading/__tests__/nativeDemoService.test.ts src/private-trading/__tests__/nativeReduceOnlyClose.test.ts src/private-trading/__tests__/nativeOrderSizing.test.ts src/private-trading/__tests__/nativeErrorMessages.test.ts src/private-trading/__tests__/nativeRiskContract.test.ts src/private-trading/__tests__/nativeIsolatedGap.test.ts src/private-trading/__tests__/nativeStress30.test.ts src/private-trading/__tests__/nativeCallGraph.test.ts src/private-trading/__tests__/nativeTradeLifecycle.test.ts src/private-trading/__tests__/nativeReduceOnlyAdmission.test.ts src/private-trading/__tests__/nativeInvariants.test.ts src/private-trading/__tests__/nativeLiveLimit.test.ts src/private-trading/__tests__/nativeLeverageChange.test.ts src/private-trading/__tests__/isolatedMargin.test.ts src/private-trading/__tests__/moneyMatrix.test.ts src/private-trading/__tests__/crossAccount.test.ts src/private-trading/__tests__/crossDemo.test.ts src/api/routes/__tests__/nativeDemoAccess.test.ts frontend/src/lib/__tests__/nativeDemoFrontend.test.ts frontend/src/lib/__tests__/nativeFuturesTerminal.test.ts frontend/src/lib/__tests__/nativeReduceTarget.test.ts frontend/src/lib/__tests__/nativeCommandLane.test.ts frontend/src/lib/__tests__/nativeChartExits.test.ts frontend/src/lib/__tests__/largeNumberPresentation.test.ts frontend/src/lib/__tests__/privateTradingFrontend.test.ts src/private-trading/__tests__/simulationOnlyIsolation.test.ts
      - name: Disposable browser tooling
        id: browser-tooling
        run: |
          npm install --prefix /tmp/native-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/native-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exact table LIMIT close in Cross and Isolated (desktop and phone)
        env:
          PRIVATE_CARD_QA_PLAYWRIGHT: /tmp/native-browser/node_modules/playwright
        run: node scripts/qa-native-demo-limit-close.cjs
      - name: Actual native terminal interactive browser checks
        env:
          PRIVATE_CARD_QA_PLAYWRIGHT: /tmp/native-browser/node_modules/playwright
        run: node scripts/qa-native-demo-browser.cjs
      - name: Large financial values keep their layout (desktop and phone)
        if: ${{ !cancelled() && steps.browser-tooling.outcome == 'success' }}
        env:
          PRIVATE_CARD_QA_PLAYWRIGHT: /tmp/native-browser/node_modules/playwright
        run: node scripts/qa-large-numbers-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-demo-evidence
          path: |
            native-target-tests.json
            native-tests.json
            docs/qa/native-demo/
          retention-days: 7
