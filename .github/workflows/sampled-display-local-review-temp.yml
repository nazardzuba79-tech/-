name: TEMP sampled display offline review bundle
on:
  push:
    branches: ['chatgpt/sampled-display-budget']
    paths: ['.github/workflows/sampled-display-local-review-temp.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable test dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund && npm ci --prefix frontend --ignore-scripts --no-audit --no-fund && npx prisma generate
      - name: Package explicit source and dependencies, never credentials or databases
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > REVIEW_HEAD.txt
          tar --exclude='.env*' --exclude='*.log' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' \
            -czf /tmp/voltex-review.tar.gz \
            src frontend/src scripts node_modules frontend/node_modules prisma .github/workflows \
            package.json package-lock.json tsconfig*.json jest* frontend/package.json frontend/package-lock.json \
            frontend/tsconfig*.json frontend/vite* frontend/index.html REVIEW_HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: voltex-sampled-offline-review
          path: /tmp/voltex-review.tar.gz
          retention-days: 1
          compression-level: 0
