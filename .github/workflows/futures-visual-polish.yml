name: Futures trading panel and order book polish
'on':
  push:
    branches:
      - codex/release-qa-final-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-final-20261006-futures-visual-polish.yml
  cancel-in-progress: false
jobs:
  visual-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ca69d47eaccccf18a1bd7e45e34452fcd60e9e91
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = 'ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
          echo 'RELEASE_QA_SOURCE_SHA=ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Brief guards
        run: >-
          npx jest frontend/src/lib/__tests__/futuresVisualPolish.test.ts
          frontend/src/lib/__tests__/terminalDesignSystem.test.ts
          frontend/src/lib/__tests__/terminalMobileParity.test.ts frontend/src/lib/__tests__/referenceBook.test.ts
          frontend/src/lib/__tests__/futuresOrderCalculatorRegression.test.ts
          frontend/src/lib/__tests__/futuresProTerminal.test.ts frontend/src/lib/__tests__/mobileTradeDeposit.test.ts
      - name: Frontend TypeScript and production bundle
        run: npm run build --prefix frontend
      - name: 'Ruler math, presentation and trading preservation'
        run: >-
          npx jest --runInBand frontend/src/lib/__tests__/chartDrawings.test.ts
          frontend/src/lib/__tests__/rulerMeasure.test.ts frontend/src/lib/__tests__/rulerLabel.test.ts
          frontend/src/lib/__tests__/rulerPresentation.test.ts frontend/src/lib/__tests__/tradingViewRulerLayer.test.ts
          frontend/src/lib/__tests__/chartTrading.test.ts frontend/src/lib/__tests__/spotChartPriceFormat.test.ts
      - name: Disposable browser tooling
        run: >
          npm install --prefix /tmp/visual-polish-browser --no-save --ignore-scripts --no-audit --no-fund
          playwright@1.63.0

          node /tmp/visual-polish-browser/node_modules/playwright/cli.js install --with-deps chromium

          # The original author harness uses this absolute module path.

          # Supply it only in the disposable runner; production is untouched.

          sudo mkdir -p /opt/node22/lib/node_modules

          sudo ln -s /tmp/visual-polish-browser/node_modules/playwright /opt/node22/lib/node_modules/playwright
      - name: 'Futures browser QA at desktop and 320, 360, 390, 430 mobile widths'
        run: node scripts/qa-futures-visual-polish.cjs --label ci
      - name: 'Real Futures proportions, all desktop widths and mobile'
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/visual-polish-browser/node_modules/playwright
        run: >-
          node scripts/qa-futures-proportions.cjs --phase after --widths 1920,1664,1600,1550,1531,1440,1366,390 --out
          docs/qa/futures-proportions-ci
      - name: 'Spot and CFD mobile browser QA at 320, 360, 390, 430'
        run: node scripts/qa-spot-cfd-terminal.cjs
      - name: VTA source-specific connection and readable measurement card
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/visual-polish-browser/node_modules/playwright
        run: node scripts/qa-vta-presentation.cjs
      - name: 'NRX ruler labels, actual plot bounds, handles and live end'
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/visual-polish-browser/node_modules/playwright
        run: 'node scripts/qa-chart-ruler-label.cjs --label ci --widths 1440,1366,390'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'futures-visual-polish-${{ github.sha }}'
          path: |
            docs/qa/futures-visual-polish/ci-*
            docs/qa/futures-proportions-ci/*
            docs/qa/spot-cfd-terminal/*
            output/vta-presentation/*
            output/chart-ruler-label/*
          retention-days: 7
          if-no-files-found: warn
