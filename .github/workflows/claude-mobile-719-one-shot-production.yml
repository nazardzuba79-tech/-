name: Claude 719 mobile pinned one-shot production release
on:
  push:
    branches:
      - 'release/claude-mobile-719-production-pinned-20261120'
    paths:
      - '.github/workflows/claude-mobile-719-one-shot-production.yml'
permissions:
  contents: read
concurrency:
  group: voltex-pages-production-release
  cancel-in-progress: false
jobs:
  publish-reviewed-assets:
    if: github.ref == 'refs/heads/release/claude-mobile-719-production-pinned-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: pages-production
    env:
      CLOUDFLARE_ACCOUNT_ID: c379227476dedde6dff09c787ffdb510
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      EXPECTED_BASE: 31b510c2a3e4c007751dc3f12fa2c5e3bda38c0c
      EXPECTED_PARENT: f8f3a2c4cd6ff8e8e46f746cfb0baf3946f2d5e5
      EXPECTED_DEPLOYMENT: c489d093-d509-467b-8e77-f7344f52db3a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove one-shot candidate ancestry, exact mobile scope and frozen locales
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git diff --exit-code "$EXPECTED_BASE" HEAD -- frontend/src/lib/i18n frontend/src/lib/testMarkets.ts src
          node <<'NODE'
          const cp=require('node:child_process');
          const allowed=new Set([
            '.github/workflows/mobile-spot-cfd-719-release.yml',
            '.github/workflows/claude-mobile-719-one-shot-production.yml',
            'frontend/src/components/FuturesMobilePositions.css',
            'frontend/src/components/OrderForm.tsx',
            'frontend/src/pages/TradePage.tsx',
            'frontend/src/pages/trade-terminal/FuturesMobileReference.css',
            'frontend/src/pages/trade-terminal/SpotMobileReference.css',
            'scripts/qa-spot-mobile-terminal.cjs',
            'scripts/qa-futures-mobile-terminal.cjs',
            'scripts/qa-futures-mobile-position-card.cjs'
          ]);
          const changes=cp.execFileSync('git',['diff','--name-only',process.env.EXPECTED_BASE,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const unexpected=changes.filter(f=>!allowed.has(f));
          if(unexpected.length||changes.length!==allowed.size)throw new Error('Unexpected changed files, release refused: '+JSON.stringify({unexpected,total:changes.length}));
          console.log('Exact parent, production ancestor, immutable locales and 10-file allowlist PASS');
          NODE
      - name: Verify current Cloudflare project and production HEAD, load same build variables privately
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_PAGES_TOKEN missing; no deployment"; exit 1; fi
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/voltex-exchange" -o /tmp/voltex-project.json
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/voltex-exchange/deployments?env=production&per_page=12&page=1" -o /tmp/voltex-prod.json
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/voltex-project.json','utf8'));
          const l=JSON.parse(fs.readFileSync('/tmp/voltex-prod.json','utf8'));
          if(!p.success||p.result?.name!=='voltex-exchange'||p.result?.production_branch!=='main'||p.result?.source?.type!=='github'||p.result?.source?.config?.repo_name!=='-') throw Error('Pages project identity mismatch');
          if(!l.success||!Array.isArray(l.result)) throw Error('Cannot verify production deployments');
          const old=l.result.find(d=>d.environment==='production'&&d.latest_stage?.name==='deploy'&&d.latest_stage?.status==='success');
          if(old?.id!==process.env.EXPECTED_DEPLOYMENT||old?.deployment_trigger?.metadata?.commit_hash!==process.env.EXPECTED_BASE) throw Error('Live production SHA changed, no deployment');
          const vars=p.result.deployment_configs?.production?.env_vars||{};
          const keys=['VITE_API_URL','VITE_DEPOSIT_CATALOGUE_URL','VITE_MANUAL_DEPOSIT_CATALOGUE'];
          for(const key of keys){
            const v=vars[key];
            if(v?.type!=='plain_text'||typeof v.value!=='string'||!v.value||/[\r\n]/.test(v.value))throw Error('Production build variable missing/unsafe: '+key);
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+v.value+'\n');
          }
          console.log('Verified unchanged production and injected 3 Cloudflare build variables without printing values');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies and build with Cloudflare production variables
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
      - name: Functional scoped Jest gate, dictionary bytes preserved by exact Git diff above
        run: npx jest --runInBand frontend/src/lib/__tests__/futuresUiPolish.test.ts frontend/src/lib/__tests__/terminalMobileParity.test.ts frontend/src/lib/__tests__/spotOrderEntry.test.ts
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/voltex-719-deploy-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/voltex-719-deploy-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: All three mobile functional QA sets, every write denied
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/voltex-719-deploy-browser/node_modules/playwright
        run: |
          node scripts/qa-spot-mobile-terminal.cjs --out output/mobile-719-release-spot
          node scripts/qa-futures-mobile-terminal.cjs --out output/mobile-719-release-futures
          node scripts/qa-futures-mobile-position-card.cjs --out output/mobile-719-release-positions
      - name: Deploy EXACT tested dist to Cloudflare production branch, never Git main source
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy frontend/dist \
            --project-name=voltex-exchange \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Reviewed mobile Claude 719 one-shot pinned release $GITHUB_SHA" \
            --commit-dirty=false
      - name: Verify Cloudflare production SHA and public landing page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/voltex-exchange/deployments?env=production&per_page=12&page=1" -o /tmp/voltex-new-prod.json
            if node <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/voltex-new-prod.json','utf8'));
          const d=(x.result||[]).find(d=>d.environment==='production'&&d.deployment_trigger?.metadata?.commit_hash===process.env.GITHUB_SHA&&d.latest_stage?.status==='success'&&d.latest_stage?.name==='deploy');
          if(!x.success||!d?.id) process.exit(1);
          fs.writeFileSync('/tmp/voltex-verified-release-id',d.id);
          console.log('Cloudflare verified production deployment:',d.id,'SHA:',process.env.GITHUB_SHA);
          NODE
            then break; fi
            if [ "$attempt" = 18 ]; then echo "::error::Production deployment confirmation failed"; exit 1; fi
            sleep 10
          done
          curl --retry 3 --retry-delay 5 --fail --silent --show-error --location --output /dev/null https://voltextech.net/
          echo "Deployment ID: $(cat /tmp/voltex-verified-release-id)" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact released SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-719-one-shot-${{ github.sha }}
          path: output/mobile-719-release-*/**
          retention-days: 7
          if-no-files-found: warn
