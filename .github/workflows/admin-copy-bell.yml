# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Admin deposit-copy bell
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-20261006-admin-copy-bell.yml
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: 'Copy bell, authorization and existing admin regressions (synthetic only)'
        run: >-
          npx jest --runInBand --runTestsByPath src/api/routes/__tests__/adminDepositCopyBell.test.ts
          src/api/routes/__tests__/adminUsers.test.ts src/api/routes/__tests__/adminCustomers.test.ts
          frontend/src/lib/__tests__/adminDepositCopyBell.test.ts frontend/src/lib/__tests__/adminUsersActivity.test.ts
      - run: npm run build
      - run: npx tsc -b frontend
