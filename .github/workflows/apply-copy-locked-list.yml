name: Apply locked copy trader list
on:
  push:
    branches:
      - codex/copy-trading-locked-list
    paths:
      - .github/workflows/apply-copy-locked-list.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify base
        run: |
          git fetch origin main codex/copy-trading-locked-list
          test "$(git rev-parse origin/main)" = "54a410ef52c8c50932d95b53e90d5d88446cd165"
          test "$(git rev-parse origin/codex/copy-trading-locked-list)" = "$GITHUB_SHA"
      - name: Apply exact source transform
        run: python scripts/apply-copy-locked-list.py
      - name: Build frontend
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
      - name: Commit final source and remove one-shot helpers
        run: |
          git diff --check
          git rm .github/workflows/apply-copy-locked-list.yml scripts/apply-copy-locked-list.py
          git add frontend/src/pages/copy-trading-bolt/components.tsx frontend/src/pages/copy-trading-bolt/LockedTraderList.css
          git config user.name "VOLTEX copy catalogue update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use lightweight whitelist list beyond featured copy traders"
          git push origin HEAD:refs/heads/codex/copy-trading-locked-list
