name: CFD multi-provider shadow validation
on:
  pull_request:
    paths:
      - 'src/services/marketData/cfd/ReferenceQuoteRouter.ts'
      - 'scripts/test-cfd-reference-router.cjs'
      - 'scripts/probe-cfd-reference-providers.cjs'
      - '.github/workflows/cfd-multi-provider-shadow.yml'
permissions:
  contents: read
concurrency:
  group: cfd-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client (no DB connection or migrations)
        run: npx prisma generate
      - name: Backend build
        run: npm run build
      - name: Deterministic reference routing tests
        run: node --test scripts/test-cfd-reference-router.cjs
      - name: Existing CFD regression tests
        run: npm test -- --runInBand --testPathPattern='Cfd|cfd' --passWithNoTests
      - name: Frontend dependency install and build
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded public reference probes (never admissions)
        run: node scripts/probe-cfd-reference-providers.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cfd-public-provider-probe
          path: docs/qa/cfd-multi-provider/public-probe.json
          retention-days: 7
