name: CX23 passive sampler fixture review
on:
  pull_request:
    paths:
      - 'scripts/cx23-24h-*.mjs'
      - 'docs/qa/stocks/CX23-24H-PILOT-REVIEW-20261013.md'
      - '.github/workflows/cx23-readonly-review.yml'
permissions:
  contents: read
jobs:
  sampler-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-head Linux fixtures only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --version
          node --check scripts/cx23-24h-readonly.mjs
          node --check scripts/cx23-24h-platform.mjs
          node --check scripts/cx23-24h-report.mjs
          node --test scripts/cx23-24h-readonly.test.mjs | tee "$RUNNER_TEMP/cx23-sampler-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cx23-sampler-fixtures-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cx23-sampler-tests.log
          retention-days: 14
          if-no-files-found: error
