name: Apply scaled locked copy catalogue
on:
  push:
    branches:
      - codex/copy-trading-locked-list
    paths:
      - .github/workflows/apply-copy-catalogue-scale.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify fresh main
        shell: bash
        run: |
          git fetch origin main codex/copy-trading-locked-list
          test "$(git rev-parse origin/main)" = "54a410ef52c8c50932d95b53e90d5d88446cd165"
      - name: Apply source transform
        run: python scripts/apply-copy-catalogue-scale.py
      - name: Check and build frontend
        shell: bash
        run: |
          git diff --check
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
      - name: Commit final source
        shell: bash
        run: |
          git rm .github/workflows/apply-copy-catalogue-scale.yml scripts/apply-copy-catalogue-scale.py
          git config user.name "VOLTEX catalogue update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/copy-trading-bolt/components.tsx frontend/src/pages/copy-trading-bolt/LockedTraderList.css frontend/src/pages/copy-trading-bolt/lockedCatalogue.ts
          git commit -m "Scale invitation-only copy catalogue and defer profile analytics"
          git push origin HEAD:refs/heads/codex/copy-trading-locked-list
