name: Futures ticker label visibility
on:
  pull_request:
    paths:
      - 'frontend/src/components/FuturesPairList*'
      - 'frontend/src/pages/trade-terminal/**'
      - 'frontend/src/pages/FuturesPage.tsx'
      - 'scripts/qa-futures-pair-labels.cjs'
      - '.github/workflows/futures-pair-labels.yml'
permissions:
  contents: read
concurrency:
  group: futures-pair-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pair-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Frontend TypeScript and production build
        run: npm run build --prefix frontend
      - name: Browser tooling
        run: |
          npm install --prefix /tmp/pair-labels-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/pair-labels-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Real component and stylesheet visibility regression
        env:
          PRIVATE_CARD_QA_PLAYWRIGHT: /tmp/pair-labels-browser/node_modules/playwright
        run: node scripts/qa-futures-pair-labels.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-pair-labels-evidence
          path: docs/qa/futures-pair-labels/
          retention-days: 7
