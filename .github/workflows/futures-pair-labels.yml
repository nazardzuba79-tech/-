name: Futures ticker label visibility
'on':
  push:
    branches:
      - codex/release-qa-final-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-final-20261006-futures-pair-labels.yml
  cancel-in-progress: false
jobs:
  pair-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ca69d47eaccccf18a1bd7e45e34452fcd60e9e91
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = 'ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
          echo 'RELEASE_QA_SOURCE_SHA=ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Frontend TypeScript and production build
        run: npm run build --prefix frontend
      - name: Existing Futures sorting and unknown-value regressions
        run: npm test -- --runInBand --runTestsByPath frontend/src/lib/__tests__/futuresPairSort.test.ts
      - name: Browser tooling
        run: >
          npm install --prefix /tmp/pair-labels-browser --no-save --ignore-scripts --no-audit --no-fund
          playwright@1.63.0

          node /tmp/pair-labels-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Real component and stylesheet visibility regression
        env:
          PRIVATE_CARD_QA_PLAYWRIGHT: /tmp/pair-labels-browser/node_modules/playwright
        run: node scripts/qa-futures-pair-labels.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-pair-labels-evidence
          path: docs/qa/futures-pair-labels/
          retention-days: 7
