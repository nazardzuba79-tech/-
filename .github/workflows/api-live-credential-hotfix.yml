name: P0 Hetzner API credential vault hotfix (live commit only)
on:
  pull_request:
    paths:
      - 'src/api/routes/auth.ts'
      - 'src/api/routes/account.ts'
      - 'src/api/routes/adminUsers.ts'
      - 'src/api/routes/adminPagedReads.ts'
      - 'src/api/routes/__tests__/auth.test.ts'
      - 'src/api/routes/__tests__/account.test.ts'
      - 'src/api/routes/__tests__/adminUsers.test.ts'
      - '.github/workflows/api-live-credential-hotfix.yml'
permissions:
  contents: read
jobs:
  live-base-security-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Compile live-based API without migrations or server access
        run: npm run build
      - name: Auth register, login, password update and admin User list
        run: >-
          npx jest --runInBand --runTestsByPath
          src/api/routes/__tests__/auth.test.ts
          src/api/routes/__tests__/account.test.ts
          src/api/routes/__tests__/adminUsers.test.ts
      - name: No production writes or deployment
        run: echo 'Local build/tests only; no SSH, database writes, or deployment'
