name: Pages token presence probe (no Cloudflare call)

# Read-only probe: reports only whether the Pages secret is non-empty.
# It never sends the token anywhere and performs no deployment.
on:
  push:
    branches: [claude/voltex-mobile-audit-7rpjni-pages-token-probe]

permissions:
  contents: read

jobs:
  repo-level:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository-level secret present?
        env:
          T: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "repo-level token PRESENT"; else echo "repo-level token MISSING"; fi
  environment-level:
    runs-on: ubuntu-24.04
    environment: pages-production
    steps:
      - name: pages-production environment secret present?
        env:
          T: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "environment token PRESENT"; else echo "environment token MISSING"; fi
