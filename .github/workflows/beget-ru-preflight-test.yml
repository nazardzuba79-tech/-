name: Beget RU gateway offline preflight tests

on:
  pull_request:
    paths:
      - 'scripts/qa-beget-ru-preflight.mjs'
      - 'scripts/qa-beget-ru-preflight.test.mjs'
      - '.github/workflows/beget-ru-preflight-test.yml'

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify mock-only GET and failure cases
        run: node --test scripts/qa-beget-ru-preflight.test.mjs
