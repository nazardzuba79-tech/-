name: Copy Futures Native Demo executor (isolated PostgreSQL)
on:
  pull_request:
    paths:
      - 'src/private-trading/native/service.ts'
      - 'src/services/copyTrading/FuturesCopyCommitGuard.ts'
      - 'src/services/copyTrading/FuturesDemoFollowerExecutor.ts'
      - 'src/services/copyTrading/FuturesDemoObserverService.ts'
      - 'src/services/copyTrading/__tests__/FuturesCopyCommitGuard.test.ts'
      - 'prisma/**'
      - 'scripts/test-copy-futures-executor-postgres.cjs'
      - '.github/workflows/copy-futures-executor-isolated.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: copy_demo_futures_exec_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/copy_demo_futures_exec_ci
      DIRECT_URL: postgresql://postgres:fixture@127.0.0.1:5432/copy_demo_futures_exec_ci
      COPY_FUTURES_EXEC_TEST_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/copy_demo_futures_exec_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate && npx prisma migrate deploy && npm run build
      - run: npx jest --runInBand src/services/copyTrading/__tests__/FuturesCopyCommitGuard.test.ts
      - run: node scripts/test-copy-futures-executor-postgres.cjs
