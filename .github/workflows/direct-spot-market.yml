# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Direct Spot public market data
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
jobs:
  direct-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Direct Spot parser and terminal regression tests
        run: >-
          npx jest --runInBand --silent --runTestsByPath frontend/src/lib/__tests__/spotPublicMarket.test.ts
          frontend/src/lib/__tests__/spotOrderBook.test.ts frontend/src/lib/__tests__/futuresUiPolish.test.ts
      - name: Production frontend build
        run: npm run build --prefix frontend
      - name: Worker public-market contract
        run: node --experimental-default-type=module workers/market-edge/test.mjs
concurrency:
  group: release-qa-20261006-direct-spot-market.yml
  cancel-in-progress: false
