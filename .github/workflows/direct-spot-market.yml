name: Direct Spot public market data
'on':
  push:
    branches:
      - codex/release-qa-validation-20261006
permissions:
  contents: read
jobs:
  direct-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9866714f1541bb878eb1aa01176d6ac97059b177
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = '9866714f1541bb878eb1aa01176d6ac97059b177'
          echo 'RELEASE_QA_SOURCE_SHA=9866714f1541bb878eb1aa01176d6ac97059b177'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Direct Spot parser and terminal regression tests
        run: >-
          npx jest --runInBand --silent --runTestsByPath frontend/src/lib/__tests__/spotPublicMarket.test.ts
          frontend/src/lib/__tests__/spotOrderBook.test.ts frontend/src/lib/__tests__/futuresUiPolish.test.ts
      - name: Production frontend build
        run: npm run build --prefix frontend
      - name: Worker public-market contract
        run: node --experimental-default-type=module workers/market-edge/test.mjs
concurrency:
  group: release-qa-validation-20261006-direct-spot-market.yml
  cancel-in-progress: false
