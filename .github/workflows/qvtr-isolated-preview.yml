name: QVTR isolated append-only preview
on:
  pull_request:
    paths:
      - 'src/services/listings/isolatedScenarioJournal.ts'
      - 'src/services/listings/qvtrIsolatedCandidate.ts'
      - 'src/services/testMarkets/testMarketSimulation.ts'
      - 'src/services/listings/__tests__/isolatedScenarioJournal.test.ts'
      - 'config/isolated/**'
      - 'scripts/*qvtr-isolated*'
      - 'scripts/isolated-scenario-admin.cjs'
      - '.github/workflows/qvtr-isolated-preview.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    # Match the pinned browser's supported image; latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --runInBand src/services/listings/__tests__/isolatedScenarioJournal.test.ts src/services/listings/__tests__/qvtrDraft.test.ts src/services/listings/__tests__/listingScenarioControls.test.ts
      - run: node scripts/qvtr-isolated-preview.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-qvtr-isolated-preview.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: qvtr-isolated-${{ github.event.pull_request.head.sha }}
          path: artifacts/qvtr-isolated
