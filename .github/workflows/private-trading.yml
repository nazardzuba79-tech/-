name: Private trading and replay
on:
  pull_request:
    paths:
      - 'src/private-trading/**'
      - 'src/api/routes/privateTrading.ts'
      - 'src/api/routes/__tests__/privateTrading.test.ts'
      - 'src/services/DemoTradingService.ts'
      - 'src/services/__tests__/DemoTradingService.test.ts'
      - 'frontend/src/lib/private*'
      - 'frontend/src/lib/chartTrading.ts'
      - 'frontend/src/lib/__tests__/private*'
      - 'frontend/src/lib/__tests__/chartTrading.test.ts'
      - 'frontend/src/pages/private-trading/**'
      - 'frontend/src/components/PriceChart.tsx'
      - 'frontend/src/components/TerminalChart*'
      - 'prisma/**'
      - 'scripts/qa-private-*'
      - '.github/workflows/private-trading.yml'
permissions:
  contents: read
concurrency:
  group: private-trading-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: private_qa
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: voltex_private_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U private_qa -d voltex_private_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable loopback PostgreSQL only. Never inject production secrets.
      DATABASE_URL: postgresql://private_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_private_qa?schema=public
      DIRECT_URL: postgresql://private_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_private_qa?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild bcrypt --build-from-source
      - run: npx prisma generate
      - name: Backend build
        run: npm run build
      - name: Market-data collector build
        run: npx tsc -p tsconfig.collector.json
      - name: Frontend TypeScript and production build
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
        run: npm run build
      - name: Initialize disposable integration database from the committed migrations
        run: npx prisma migrate deploy
      - name: Private trading, access isolation and chart regressions
        env:
          PRIVATE_TRADING_DB_TESTS: '1'
        run: >-
          npm test -- --runInBand --silent --json --outputFile=private-trading-tests.json
          --runTestsByPath
          src/private-trading/__tests__/crossDemo.test.ts
          src/private-trading/__tests__/nativeDemoEngine.test.ts
          src/private-trading/__tests__/nativeDemoReplay.test.ts
          src/private-trading/__tests__/nativeDemoService.test.ts
          src/private-trading/__tests__/nativeHistoricalCurrent.test.ts
          src/private-trading/__tests__/nativeLiveProjection.test.ts
          src/private-trading/__tests__/nativeDemo.integration.test.ts
          src/private-trading/__tests__/nativeCommandAcceptance.integration.test.ts
          src/private-trading/__tests__/nativeCommandDeadline.test.ts
          src/private-trading/__tests__/nativeSharedLane.test.ts
          frontend/src/lib/__tests__/nativeRequestDeadline.test.ts
          src/private-trading/__tests__/nativeOptimization.test.ts
          src/private-trading/__tests__/nativeJournalFinal.test.ts
          src/private-trading/__tests__/nativeLiveLimit.test.ts
          src/private-trading/__tests__/nativeBookReplay.test.ts
          src/private-trading/__tests__/nativeObservedBookExecution.test.ts
          src/private-trading/__tests__/nativeCallGraph.test.ts
          src/api/routes/__tests__/nativeDemoAccess.test.ts
          src/private-trading/__tests__/chartMarketData.test.ts
          src/private-trading/__tests__/liveEngine.test.ts
          src/private-trading/__tests__/marketData.test.ts
          src/private-trading/__tests__/math.test.ts
          src/private-trading/__tests__/replay.test.ts
          src/private-trading/__tests__/service.integration.test.ts
          src/private-trading/__tests__/service.runtime.test.ts
          src/private-trading/__tests__/store.test.ts
          src/api/routes/__tests__/privateTrading.test.ts
          src/services/__tests__/DemoTradingService.test.ts
          frontend/src/lib/__tests__/chartDrawings.test.ts
          frontend/src/lib/__tests__/chartTrading.test.ts
          frontend/src/lib/__tests__/priceChartMarketOrders.test.ts
          frontend/src/lib/__tests__/privateChartTicket.test.ts
          frontend/src/lib/__tests__/privateTradingFrontend.test.ts
      - name: Checkout exact pre-optimization baseline for short capacity comparison
        uses: actions/checkout@v4
        with:
          ref: d3510b2b4601bbd09476f03c5ac98fb72537a2b7
          path: benchmark-before
          persist-credentials: false
      - name: Short before/after capacity test on disposable PostgreSQL
        timeout-minutes: 3
        env:
          BENCH_DB: '1'
          BENCH_FRAME: '1'
        run: |
          node node_modules/typescript/bin/tsc -p benchmark-before/tsconfig.json
          BENCH_DIST=benchmark-before/dist node --expose-gc scripts/bench-native-engine.cjs --ops 30 --contracts 1,10 --label before-d3510b2 --out capacity-before.json
          node --expose-gc scripts/bench-native-engine.cjs --ops 30 --contracts 1,10 --label candidate --out capacity-after.json
      - name: Preserve short capacity measurements
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-capacity-146
          path: capacity-*.json
          retention-days: 7
      - name: Install disposable card browser tooling
        run: |
          npm install --prefix /tmp/voltex-private-card-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/voltex-private-card-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Actual P&L dialog and PNG browser QA
        env:
          PRIVATE_CARD_QA_PLAYWRIGHT: /tmp/voltex-private-card-qa/node_modules/playwright
        run: node scripts/qa-private-card-browser.cjs
      - name: Preserve test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-trading-tests
          path: private-trading-tests.json
          retention-days: 7
      - name: Preserve card browser evidence
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-trading-card-browser
          path: docs/qa/private-trading/card-browser/
          retention-days: 7
      - name: Preserve exact card review inputs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-trading-card-review-source
          path: |
            frontend/src/lib/privateResultCard.ts
            frontend/src/lib/privateTradingApi.ts
            frontend/src/lib/__tests__/privateTradingFrontend.test.ts
            frontend/src/pages/private-trading/PrivateResultCardDialog.tsx
            frontend/src/pages/private-trading/privateTrading.css
            frontend/src/pages/private-trading/privateResultCard.css
          retention-days: 7
