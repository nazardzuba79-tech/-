name: TYVN production desktop mobile acceptance (GET only)

on:
  pull_request:
    paths: ['.github/workflows/tyvn-live-browser-20261023.yml']

permissions:
  contents: read

jobs:
  live-ui:
    if: github.event.pull_request.draft == true && github.head_ref == 'review/tyvn-live-browser-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Install isolated Playwright tooling (no VOLTEX application build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tyvn-browser"
          npm install --prefix "$RUNNER_TEMP/tyvn-browser" --no-audit --no-fund --ignore-scripts playwright@1.63.0
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || { echo "::error::Chrome missing on runner"; exit 1; }
      - name: GET-only production browser verification, desktop and phone
        shell: bash
        run: |
          mkdir -p tyvn-browser-evidence
          node <<'NODE'
          const { chromium } = require(process.env.RUNNER_TEMP + '/tyvn-browser/node_modules/playwright');
          const origin='https://voltextech.net', edge='https://market.voltextech.net';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const checks=[],errors=[];
          (async()=>{
            const pub=await fetch(edge+'/market/listings',{signal:AbortSignal.timeout(15000)}).then(r=>r.json());
            const entry=(pub.assets??[]).filter(x=>x.symbol==='TYVN' || x.pair==='TYVN/USDT');
            assert(entry.length===1,'TYVN must be present exactly once in the live Worker catalogue');
            assert(entry[0].countdown==='running'&&entry[0].isTradable===false,'TYVN timer or trading safety incorrect');
            assert(Date.parse(entry[0].listingAt)===Date.parse('2026-10-27T13:00:00Z'),'TYVN launch date incorrect');
            checks.push('edge TYVN unique running tradable:false 2026-10-27 13:00 UTC');
            const browser=await chromium.launch({headless:true,executablePath:require('node:fs').existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':'/usr/bin/google-chrome-stable',args:['--no-sandbox']});
            try{
              for(const width of [1440,390]){
                const context=await browser.newContext({viewport:{width,height:width===390?844:900},locale:'ru-RU',serviceWorkers:'block'});
                const page=await context.newPage();const writes=[];
                await page.route('**/*',route=>{
                  const req=route.request(), u=new URL(req.url());
                  if(!['GET','HEAD','OPTIONS'].includes(req.method())){writes.push(req.method()+' '+u.pathname);return route.abort('blockedbyclient');}
                  if(!['voltextech.net','api.voltextech.net','market.voltextech.net'].includes(u.hostname))return route.abort('blockedbyclient');
                  return route.continue();
                });
                page.on('pageerror',e=>errors.push('width='+width+' '+e.message));
                try{
                  await page.goto(origin+'/trade?pair=TYVN%2FUSDT',{waitUntil:'domcontentloaded',timeout:25000});
                  if(width===390){
                    const chartTab=page.locator('#mobile-trade-chart');
                    if(await chartTab.count())await chartTab.click();
                  }
                  const panel=page.locator('.vta-prelisting[data-countdown="running"]');
                  await panel.waitFor({timeout:25000});
                  const timer=panel.locator('.vta-countdown[role="timer"]');
                  await timer.waitFor({timeout:12000});
                  const txt=await panel.innerText();
                  assert(txt.includes('TYVN/USDT')&&txt.includes('TERYVANE'),'pair identity missing '+width);
                  const remaining=await timer.locator('.vta-countdown-cell strong').allInnerTexts();
                  assert(remaining.length===4 && remaining.every(v=>/^\d{2}$/.test(v)),'countdown cells invalid '+width);
                  checks.push('real browser '+width+'px pair deep link and 4-field ticking countdown');
                  if(width===1440){
                    const search=page.locator('.pairs-search input');
                    await search.waitFor({timeout:15000});
                    await search.fill('TYVN');
                    const item=page.locator('.pairs-list [data-pair="TYVN/USDT"]');
                    await item.waitFor({timeout:20000});
                    checks.push('real desktop Spot search TYVN shows pair row');
                  }
                  await page.screenshot({path:'tyvn-browser-evidence/tyvn-'+width+'.png'});
                  assert(writes.length===0,'non-GET attempted: '+writes.join(','));
                } finally{await context.close();}
              }
            }finally{await browser.close();}
            assert(errors.length===0,'javascript page errors: '+errors.join(' ; '));
            console.log('TYVN_BROWSER_ACCEPTANCE '+JSON.stringify({result:'PASS',checks,errors,writes:0}));
          })().catch(err=>{console.error('TYVN_BROWSER_ACCEPTANCE_FAIL '+err.message);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tyvn-live-browser-evidence
          path: tyvn-browser-evidence/
          if-no-files-found: warn
          retention-days: 4
