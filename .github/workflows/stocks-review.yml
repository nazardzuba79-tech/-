name: Stocks isolated review
on:
  pull_request:
    paths: ['services/stocks/**', 'services/stocks-global/**', 'services/stocks-simulator/**', 'frontend/src/pages/stocks/**', 'frontend/src/lib/__tests__/stock*.test.ts', 'frontend/src/lib/stocks.ts', 'frontend/src/lib/i18n/locales/**', 'scripts/qa-stocks*', 'scripts/qa-backend-full*', '.github/workflows/stocks-review.yml']
  push:
    branches: [codex/stocks-bounded-v1-20261007]
permissions:
  contents: read
jobs:
  stocks-auth-one-burst:
    # Consumed at exact head 75e2453e; later integration heads cannot attempt this diagnostic.
    # This diagnostic never clears the retained backend/browser/capacity failures.
    needs: [stocks-auth-preparation, stocks-auth-http-paired, stocks-backend-admission, isolated-simulator, frontend-regression, bounded-stock-runtime]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 512 &&
      github.event.action == 'synchronize' && github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dot/stocks-owner-usdt-portfolio-20261013' &&
      github.event.pull_request.head.sha == '75e2453ed85c03d12114f2e29ba9acf0f6e6f31f' &&
      needs.stocks-backend-admission.result == 'success' && needs.isolated-simulator.result == 'success' &&
      needs.frontend-regression.result == 'success' && needs.bounded-stock-runtime.result == 'success'
    concurrency:
      group: stocks-one-burst-pr512
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      AUTH_BURST_POLICY_SHA256: 7fa6103f26c209f721299e60cc306fd56292d5ce1fa9a452713169cd3ee14534
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Pure diagnostic guards and one built-in worker handoff guard
        run: node --test services/stocks/auth-burst-trace-512/*.test.mjs
      - name: Verify reviewed source transition and complete same-head run history
        id: trace_source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const { pathToFileURL } = require('node:url');
            const root = process.env.GITHUB_WORKSPACE;
            const load = p => import(pathToFileURL(path.join(root, p)).href);
            const gate = await load('services/stocks/auth-burst-trace-512/launch-gate.mjs');
            const adapter = await load('services/stocks/auth-burst-trace-512/workflow-source.mjs');
            const directory = path.join(process.env.RUNNER_TEMP, 'stocks-one-burst-input');
            fs.mkdirSync(directory, { mode: 0o700 });
            const policy = JSON.parse(fs.readFileSync(path.join(root, gate.POLICY_PATH)));
            let result = { status: 'NOT_RUN', reason: 'POLICY_DISABLED', preparationEligible: false, eligible: false };
            if (policy.status !== 'disabled') {
              const input = await adapter.workflowSourceInput({
                context: { payload: context.payload, eventName: context.eventName, repo: context.repo,
                  runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) }, github,
                approvedPolicySha256: process.env.AUTH_BURST_POLICY_SHA256 });
              const git = args => execFileSync('/usr/bin/git', args, { cwd: root, timeout: 10000, maxBuffer: 16 * 1024 ** 2 });
              result = gate.validatePreparationSource(input, policy, { git });
              fs.writeFileSync(path.join(directory, 'source-input.json'), JSON.stringify(input), { flag: 'wx', mode: 0o600 });
            }
            fs.writeFileSync(path.join(directory, 'source-eligibility.json'), JSON.stringify(result, null, 2), { flag: 'wx', mode: 0o600 });
            core.setOutput('eligible', String(result.preparationEligible === true));
            core.info(`${result.status}: ${result.reason}; workload acceptance remains false.`);
            if (policy.status !== 'disabled' && result.preparationEligible !== true) core.setFailed('Reviewed source eligibility was not proven. No preparation or workload started.');
      - name: Download and verify the actual compiled artifact from this exact run
        if: steps.trace_source.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
            const { createHash } = require('node:crypto'), { pathToFileURL } = require('node:url');
            const module = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'services/stocks/auth-burst-trace-512/workflow-source.mjs')).href);
            const metadata = await module.compiledArtifactMetadata({ context, github, sourceSha: process.env.QA_SOURCE_SHA });
            const response = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: Number(metadata.artifactId),
              archive_format: 'zip', request: { timeout: 30000 } });
            const bytes = Buffer.from(response.data);
            assert.equal(bytes.length, metadata.bytes);
            const downloadedSha256 = createHash('sha256').update(bytes).digest('hex');
            assert.equal(downloadedSha256, metadata.archiveSha256);
            const directory = path.join(process.env.RUNNER_TEMP, 'stocks-one-burst-input');
            fs.writeFileSync(path.join(directory, 'stage.zip'), bytes, { flag: 'wx', mode: 0o600 });
            fs.writeFileSync(path.join(directory, 'compiled-artifact.json'), JSON.stringify({ ...metadata, downloadedSha256 }), { flag: 'wx', mode: 0o600 });
            core.info(`Verified same-run compiled artifact ${metadata.artifactId}, SHA256 ${downloadedSha256}.`);
      - name: Bind selected compiled bytes and actual local backing device
        if: steps.trace_source.outputs.eligible == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { ZIP_EXTRACTOR } from './services/stocks/auth-http-fixture-512/prepare.mjs';
          import { COMPILED_PATHS } from './services/stocks/auth-burst-trace-512/prepare-receipts.mjs';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const input = path.join(process.env.RUNNER_TEMP, 'stocks-one-burst-input');
          const stageDirectory = path.join(input, 'stage-selected'), stageArchivePath = path.join(input, 'stage.zip');
          const python = fs.realpathSync('/usr/bin/python3');
          execFileSync(python, ['-I', '-S', '-c', ZIP_EXTRACTOR, stageArchivePath, stageDirectory], { timeout: 30000, maxBuffer: 1024 ** 2 });
          const selectedMembers = ['report.json', 'package/manifest.json', 'build-provenance.json', 'build.log',
            ...COMPILED_PATHS.map(p => 'package/' + p)].map(p => {
              const file = path.join(stageDirectory, p), stat = fs.lstatSync(file);
              assert.ok(stat.isFile() && !stat.isSymbolicLink() && (stat.size > 0 || (p === 'build.log' && stat.size === 0)) && stat.size <= 16 * 1024 ** 2);
              assert.equal(fs.realpathSync(file), file);
              const bytes = fs.readFileSync(file); assert.equal(bytes.length, stat.size);
              return { path: p, bytes: bytes.length, sha256: hash(bytes) };
            });
          const compiled = JSON.parse(fs.readFileSync(path.join(input, 'compiled-artifact.json')));
          const write = (name, value) => fs.writeFileSync(path.join(input, name), JSON.stringify(value, null, 2), { flag: 'wx', mode: 0o600 });
          write('compiled-receipt.json', { ...compiled, selectedMembers });
          const exec = (tool, args) => execFileSync(tool, args, { encoding: 'utf8', timeout: 30000, maxBuffer: 1024 ** 2 }).trim();
          const majorMinor = exec('/usr/bin/findmnt', ['-n', '-o', 'MAJ:MIN', '-T', input]);
          assert.match(majorMinor, /^\d+:\d+$/);
          const matches = exec('/usr/bin/lsblk', ['-nrpo', 'NAME,MAJ:MIN']).split('\n')
            .map(line => line.trim().split(/\s+/)).filter(row => row[1] === majorMinor);
          assert.equal(matches.length, 1);
          let device = matches[0][0];
          const parent = exec('/usr/bin/lsblk', ['-ndo', 'PKNAME', device]);
          if (parent) { assert.match(parent, /^[A-Za-z0-9_-]+$/); device = '/dev/' + parent; }
          device = fs.realpathSync(device); assert.ok(fs.statSync(device).isBlockDevice());
          const common = { repository: fs.realpathSync(process.env.GITHUB_WORKSPACE),
            sourceInputPath: path.join(input, 'source-input.json'), compiledReceiptPath: path.join(input, 'compiled-receipt.json'),
            stageArchivePath, stageDirectory, device, preparationOutput: path.join(process.env.RUNNER_TEMP, 'stocks-auth-preparation-output') };
          write('prepare-request.json', { ...common, python: { executable: python, sha256: hash(fs.readFileSync(python)) } });
          write('run-request.json', { ...common, jobName: process.env.GITHUB_JOB, disk: input,
            adapterOutput: path.join(process.env.RUNNER_TEMP, 'stocks-one-burst-output'), attemptMarker: path.join(input, 'attempt.json'),
            resultPath: path.join(input, 'result.json'), dockerConfigDirectory: path.join(input, 'lease-docker-config') });
          NODE
          node services/stocks/auth-burst-trace-512/workflow-config.mjs prepare-config "$RUNNER_TEMP/stocks-one-burst-input/prepare-request.json" "$RUNNER_TEMP/stocks-one-burst-input/prepare-config.json"
      - name: Prepare verified local image and closed seed; derive guarded instrumentation
        if: steps.trace_source.outputs.eligible == 'true'
        timeout-minutes: 26
        run: node services/stocks/auth-burst-trace-512/launcher.mjs --prepare "$RUNNER_TEMP/stocks-one-burst-input/prepare-config.json"
      - name: Verify actual local preparation receipts and construct the one-attempt config
        if: steps.trace_source.outputs.eligible == 'true'
        run: node services/stocks/auth-burst-trace-512/workflow-config.mjs run-config "$RUNNER_TEMP/stocks-one-burst-input/run-request.json" "$RUNNER_TEMP/stocks-one-burst-input/run-config.json"
      - name: One C50 trace burst within the original resources and three-second deadline
        if: steps.trace_source.outputs.eligible == 'true'
        timeout-minutes: 11
        run: node services/stocks/auth-burst-trace-512/launcher.mjs --run "$RUNNER_TEMP/stocks-one-burst-input/run-config.json"
      - name: Preserve public diagnostic proofs and raw failures; never upload the image or seed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocks-one-burst-${{ github.event.pull_request.head.sha }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stocks-one-burst-input/source-eligibility.json
            ${{ runner.temp }}/stocks-one-burst-input/compiled-artifact.json
            ${{ runner.temp }}/stocks-one-burst-input/compiled-receipt.json
            ${{ runner.temp }}/stocks-one-burst-input/attempt.json
            ${{ runner.temp }}/stocks-one-burst-input/result.json
            ${{ runner.temp }}/stocks-auth-preparation-output/preparation.json
            ${{ runner.temp }}/stocks-auth-preparation-output/trace-preparation-result.json
            ${{ runner.temp }}/stocks-auth-preparation-output/public-context/runtime-source-manifest.json
            ${{ runner.temp }}/stocks-auth-preparation-output/trace-overlay/*.json
            ${{ runner.temp }}/stocks-auth-preparation-output/private/runtime-output/inside-proof.json
            ${{ runner.temp }}/stocks-auth-preparation-output/private/command-logs/*
            ${{ runner.temp }}/stocks-one-burst-output/adapter-evidence.json
            ${{ runner.temp }}/stocks-one-burst-output/driver-attempts.jsonl
            ${{ runner.temp }}/stocks-one-burst-output/driver-cgroups.jsonl
            ${{ runner.temp }}/stocks-one-burst-output/observer-*.json
  stocks-backend-admission:
    # Scheduling evidence only: NOT_RUN never clears the retained backend FAIL.
    # Missing/unreviewed inputs fail closed to a full backend run.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 512
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.admission.outputs.mode }}
      browser_mode: ${{ steps.admission.outputs.browser_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Admission and fixture pure guards (no HTTP, Docker or load)
        run: node --test scripts/qa-backend-full-admission.test.cjs services/stocks/auth-http-fixture-512/authority.test.cjs services/stocks/auth-http-fixture-512/fixture.test.mjs services/stocks/auth-http-fixture-512/prepare.test.mjs
      - id: admission
        if: always()
        env:
          QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/qa-backend-full-admission.cjs --base 28e6f3bab18bad777f9b02e31851dfe8874f2b0e --head "$QA_SOURCE_SHA" --manifest docs/evidence/stocks-auth-lifetime-20261014/reviewed-qa-followup.json > "$RUNNER_TEMP/backend-admission.json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/backend-admission.json"));if(!["full","not_run"].includes(r.mode)||r.browserMode!==(r.mode==="not_run"?"not_run":"run")||r.releaseGatePass!==false||r.priorFailure.status!=="FAIL"||r.priorBrowserFailure.status!=="FAIL")throw Error("Invalid admission evidence");fs.appendFileSync(process.env.GITHUB_OUTPUT,"mode="+r.mode+"\nbrowser_mode="+r.browserMode+"\n")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-backend-admission-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/backend-admission.json
          if-no-files-found: error
  stocks-auth-preparation:
    # Preparation only, serial after every Stocks predecessor. Never starts auth HTTP or load.
    # Retain the completed finite experiment. Later heads need a separately reviewed launch.
    needs: [stocks-backend-admission, stocks-full-backend-offline, isolated-simulator, frontend-regression, bounded-stock-runtime, stocks-ui-browser, stocks-review-selection, stocks-joined-phase-diagnostic, crypto-service-comparison, stocks-performance-profile, launch-resource-comparison, stocks-pr512-pristine-timeline, stocks-pr512-targeted-http, stocks-pr512-cx23-model, stocks-pr512-phase-diagnostic, stocks-pr512-registration-pairs]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 512 &&
      github.event.pull_request.head.sha == 'dc5327b7def5ac4f5b448f820bbd279b7072d7f9' &&
      needs.stocks-backend-admission.result == 'success' && needs.isolated-simulator.result == 'success' &&
      needs.frontend-regression.result == 'success' && needs.bounded-stock-runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Preparation pure guards (no Docker, HTTP, build or database)
        run: node --test services/stocks/auth-http-fixture-512/prepare.test.mjs
      - name: Download and verify this run's immutable stage artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const assert = require('node:assert/strict');
            assert.equal(context.repo.owner, 'nazardzuba79-tech');
            assert.equal(context.repo.repo, '-');
            assert.equal(context.payload.pull_request.number, 512);
            const head = process.env.QA_SOURCE_SHA;
            assert.match(head, /^[a-f0-9]{40}$/);
            const rows = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 });
            const matches = rows.filter(row => row.name === `stocks-local-stage-${head}`);
            assert.equal(matches.length, 1);
            const artifact = matches[0];
            assert.equal(artifact.expired, false);
            assert.equal(artifact.workflow_run.id, context.runId);
            assert.equal(artifact.workflow_run.head_sha, head);
            assert.ok(artifact.size_in_bytes > 0 && artifact.size_in_bytes <= 256 * 1024 ** 2);
            assert.match(artifact.digest, /^sha256:[a-f0-9]{64}$/);
            const response = await github.rest.actions.downloadArtifact(
              { ...context.repo, artifact_id: artifact.id, archive_format: 'zip' });
            const zip = Buffer.from(response.data);
            assert.equal(zip.length, artifact.size_in_bytes);
            const digest = crypto.createHash('sha256').update(zip).digest('hex');
            assert.equal(`sha256:${digest}`, artifact.digest);
            const input = path.join(process.env.RUNNER_TEMP, 'stocks-auth-preparation-input');
            assert.ok(!fs.existsSync(input));
            fs.mkdirSync(input, { mode: 0o700 });
            fs.writeFileSync(path.join(input, 'stage.zip'), zip, { flag: 'wx', mode: 0o600 });
            fs.writeFileSync(path.join(input, 'artifact.json'), JSON.stringify({
              sourceSha: head, runId: String(context.runId), artifactId: String(artifact.id),
              sha256: digest, bytes: zip.length, producerJob: 'isolated-simulator'
            }, null, 2), { flag: 'wx', mode: 0o600 });
            core.info(`Verified same-head stage artifact ${artifact.id}, SHA256 ${digest}; no workload started.`);
      - name: Bind explicit preparation inputs without executing downloaded code
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { BASE_IMAGE, PREPARE_SCHEMA, validateConfig } from './services/stocks/auth-http-fixture-512/prepare.mjs';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const input = path.join(process.env.RUNNER_TEMP, 'stocks-auth-preparation-input');
          const artifact = JSON.parse(fs.readFileSync(path.join(input, 'artifact.json')));
          const python = fs.realpathSync('/usr/bin/python3');
          const archive = path.join(input, 'stage.zip');
          const proof = execFileSync(python, ['-I', '-S', '-c',
            "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); a=[i for i in z.infolist() if i.filename=='build-provenance.json']; assert len(a)==1 and 0<a[0].file_size<=16777216; sys.stdout.buffer.write(z.read(a[0]))", archive],
            { timeout: 30000, maxBuffer: 16 * 1024 ** 2 });
          const exec = (tool, args) => execFileSync(tool, args, { encoding: 'utf8', timeout: 30000 }).trim();
          const majorMinor = exec('findmnt', ['-n', '-o', 'MAJ:MIN', '-T', input]);
          assert.match(majorMinor, /^\d+:\d+$/);
          const matches = exec('lsblk', ['-nrpo', 'NAME,MAJ:MIN']).split('\n')
            .map(line => line.trim().split(/\s+/)).filter(row => row[1] === majorMinor);
          assert.equal(matches.length, 1);
          let device = matches[0][0];
          const parent = exec('lsblk', ['-ndo', 'PKNAME', device]);
          if (parent) { assert.match(parent, /^[A-Za-z0-9_-]+$/); device = `/dev/${parent}`; }
          device = fs.realpathSync(device);
          assert.ok(fs.statSync(device).isBlockDevice());
          const config = validateConfig({ schema: PREPARE_SCHEMA, sourceSha: process.env.QA_SOURCE_SHA,
            stage: { archive, sha256: artifact.sha256, sourceSha: artifact.sourceSha,
              runId: artifact.runId, artifactId: artifact.artifactId, buildProvenanceSha256: digest(proof) },
            baseImage: BASE_IMAGE, python: { executable: python, sha256: digest(fs.readFileSync(python)) },
            output: path.join(process.env.RUNNER_TEMP, 'stocks-auth-preparation-output'), device });
          fs.writeFileSync(path.join(input, 'config.json'), JSON.stringify(config, null, 2), { flag: 'wx', mode: 0o600 });
          NODE
      - name: Prepare immutable image, closed fixture seed and idle resource evidence only
        run: node services/stocks/auth-http-fixture-512/prepare.mjs --prepare "$RUNNER_TEMP/stocks-auth-preparation-input/config.json"
      - name: Preserve successfully prepared immutable fixture inputs
        uses: actions/upload-artifact@v4
        with:
          name: stocks-auth-prepared-inputs-${{ github.event.pull_request.head.sha }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stocks-auth-preparation-output/private/runtime-image.tar
            ${{ runner.temp }}/stocks-auth-preparation-output/private/runtime-output/private/seed/accounts.sqlite
      - name: Preserve bounded preparation report and command failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocks-auth-preparation-${{ github.event.pull_request.head.sha }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stocks-auth-preparation-input/artifact.json
            ${{ runner.temp }}/stocks-auth-preparation-output/preparation.json
            ${{ runner.temp }}/stocks-auth-preparation-output/public-context/runtime-source-manifest.json
            ${{ runner.temp }}/stocks-auth-preparation-output/private/runtime-output/inside-proof.json
            ${{ runner.temp }}/stocks-auth-preparation-output/private/command-logs/*

  stocks-auth-http-paired:
    # Finite fixture attribution only. Backend/browser/capacity FAIL remain release blockers.
    # Preparation already waits for every prior Stocks workload; this job never retries one.
    # NOT_RUN on later heads; do not reuse this frozen source/resource launch policy.
    needs: stocks-auth-preparation
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 512 &&
      github.event.pull_request.head.sha == 'dc5327b7def5ac4f5b448f820bbd279b7072d7f9' &&
      github.event.pull_request.head.repo.full_name == github.repository && needs.stocks-auth-preparation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      AUTH_POLICY_SHA256: 045603548ad6422416c9ad20b70da2e5970b9796accc0ada54419495ecd0c133
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Pure launch and connection-observation guards
        run: node --test services/stocks/auth-http-fixture-512/launcher.test.mjs services/stocks/auth-http-fixture-512/durability-observer.test.cjs
      - name: Download and bind three immutable same-run fixture artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const { createHash } = require('node:crypto'), assert = require('node:assert/strict');
            assert.equal(context.repo.owner, 'nazardzuba79-tech'); assert.equal(context.repo.repo, '-');
            assert.equal(context.payload.pull_request.number, 512);
            assert.equal(context.payload.pull_request.head.ref, 'dot/stocks-owner-usdt-portfolio-20261013');
            const head = process.env.QA_SOURCE_SHA; assert.match(head, /^[a-f0-9]{40}$/);
            assert.match(process.env.AUTH_POLICY_SHA256, /^[a-f0-9]{64}$/);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            assert.equal(run.head_sha, head);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 });
            const input = path.join(process.env.RUNNER_TEMP, 'stocks-auth-launch-input');
            assert.ok(!fs.existsSync(input)); fs.mkdirSync(input, { mode: 0o700 });
            const receipts = {};
            for (const [key, prefix, limit] of [
              ['stage', 'stocks-local-stage-', 256 * 1024 ** 2],
              ['preparation', 'stocks-auth-preparation-', 256 * 1024 ** 2],
              ['inputs', 'stocks-auth-prepared-inputs-', 512 * 1024 ** 2],
            ]) {
              const matches = artifacts.filter(a => a.name === prefix + head && !a.expired);
              assert.equal(matches.length, 1); const artifact = matches[0];
              assert.equal(artifact.workflow_run.id, context.runId); assert.equal(artifact.workflow_run.head_sha, head);
              assert.ok(artifact.size_in_bytes > 0 && artifact.size_in_bytes <= limit);
              assert.match(artifact.digest, /^sha256:[a-f0-9]{64}$/);
              const response = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: artifact.id, archive_format: 'zip' });
              const bytes = Buffer.from(response.data); assert.equal(bytes.length, artifact.size_in_bytes);
              const hash = createHash('sha256').update(bytes).digest('hex'); assert.equal('sha256:' + hash, artifact.digest);
              fs.writeFileSync(path.join(input, key + '.zip'), bytes, { flag: 'wx', mode: 0o600 });
              receipts[key] = { artifactId: String(artifact.id), runId: String(context.runId), sourceSha: head,
                sha256: hash, bytes: bytes.length, name: artifact.name };
            }
            fs.writeFileSync(path.join(input, 'receipts.json'), JSON.stringify(receipts, null, 2), { flag: 'wx', mode: 0o600 });
      - name: Extract only fixed fixture inputs and derive this runner's backing device
        run: |
          python3 -I -S - <<'PY'
          import os,pathlib,zipfile,stat
          os.umask(0o077)
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'stocks-auth-launch-input'
          out=base/'extracted';out.mkdir(mode=0o700)
          specs={
            'preparation':{'stocks-auth-preparation-output/preparation.json':'report.json',
              'stocks-auth-preparation-output/public-context/runtime-source-manifest.json':'manifest.json',
              'stocks-auth-preparation-output/private/runtime-output/inside-proof.json':'inside.json'},
            'inputs':{'runtime-image.tar':'image.tar','runtime-output/private/seed/accounts.sqlite':'seed.sqlite'}}
          for kind,selected in specs.items():
            with zipfile.ZipFile(base/(kind+'.zip')) as z:
              rows=z.infolist();assert 0<len(rows)<=128;seen=set();total=0
              for i in rows:
                p=pathlib.PurePosixPath(i.filename)
                assert not p.is_absolute() and '..' not in p.parts and ':' not in i.filename and chr(92) not in i.filename
                mode=i.external_attr>>16
                assert i.filename==i.orig_filename and not (i.flag_bits&1)
                assert stat.S_IFMT(mode) in (0,stat.S_IFREG,stat.S_IFDIR) and i.filename.lower() not in seen
                seen.add(i.filename.lower());total+=i.file_size
              assert total <= (512*1024**2 if kind=='inputs' else 256*1024**2)
              if kind=='inputs': assert set(i.filename for i in rows)==set(selected)
              for member,target in selected.items():
                matches=[i for i in rows if i.filename==member];assert len(matches)==1 and not matches[0].is_dir()
                assert 0<matches[0].file_size<=(3*1024**3 if target=='image.tar' else 16*1024**2)
                with z.open(matches[0]) as src,open(out/target,'xb') as dst:
                  written=0
                  while True:
                    b=src.read(1024*1024)
                    if not b:break
                    written+=len(b);assert written<=matches[0].file_size
                    dst.write(b)
                assert (out/target).stat().st_size==matches[0].file_size
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto'; import { execFileSync } from 'node:child_process';
          import { SCHEMA, validateConfig } from './services/stocks/auth-http-fixture-512/launcher.mjs';
          const input = path.join(process.env.RUNNER_TEMP, 'stocks-auth-launch-input'), extracted = path.join(input, 'extracted');
          const receipts = JSON.parse(fs.readFileSync(path.join(input, 'receipts.json')));
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const file = name => path.join(extracted, name);
          const python = '/usr/bin/python3', archive = path.join(input, 'stage.zip');
          const proof = execFileSync(python, ['-I', '-S', '-c',
            "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); a=[i for i in z.infolist() if i.filename=='build-provenance.json']; assert len(a)==1 and 0<a[0].file_size<=16777216; sys.stdout.buffer.write(z.read(a[0]))", archive],
            { timeout: 30000, maxBuffer: 16 * 1024 ** 2 });
          const exec = (bin, args) => execFileSync(bin, args, { encoding: 'utf8', timeout: 30000 }).trim();
          const disk = path.join(process.env.RUNNER_TEMP, 'stocks-auth-launch-disk');
          assert.ok(!fs.existsSync(disk)); fs.mkdirSync(disk, { mode: 0o700 });
          const majorMinor = exec('findmnt', ['-n', '-o', 'MAJ:MIN', '-T', disk]); assert.match(majorMinor, /^\d+:\d+$/);
          const matches = exec('lsblk', ['-nrpo', 'NAME,MAJ:MIN']).split('\n').map(line => line.trim().split(/\s+/)).filter(row => row[1] === majorMinor);
          assert.equal(matches.length, 1); let device = matches[0][0];
          const parent = exec('lsblk', ['-ndo', 'PKNAME', device]);
          if (parent) { assert.match(parent, /^[A-Za-z0-9_-]+$/); device = '/dev/' + parent; }
          device = fs.realpathSync(device); assert.ok(fs.statSync(device).isBlockDevice());
          const config = validateConfig({ schema: SCHEMA, sourceSha: process.env.QA_SOURCE_SHA, policySha256: process.env.AUTH_POLICY_SHA256,
            stage: { archive, sha256: receipts.stage.sha256, sourceSha: receipts.stage.sourceSha, runId: receipts.stage.runId,
              artifactId: receipts.stage.artifactId, buildProvenanceSha256: hash(proof) },
            prepared: { report: file('report.json'), reportSha256: hash(fs.readFileSync(file('report.json'))),
              manifest: file('manifest.json'), manifestSha256: hash(fs.readFileSync(file('manifest.json'))),
              inside: file('inside.json'), insideSha256: hash(fs.readFileSync(file('inside.json'))), image: file('image.tar'), seed: file('seed.sqlite'),
              publicArchive: path.join(input, 'preparation.zip'), inputsArchive: path.join(input, 'inputs.zip'), runId: receipts.preparation.runId,
              publicArtifactId: receipts.preparation.artifactId, inputsArtifactId: receipts.inputs.artifactId },
            receipts, python: { executable: python, sha256: hash(fs.readFileSync(fs.realpathSync(python))) },
            output: path.join(process.env.RUNNER_TEMP, 'stocks-auth-launch-output'), disk, device });
          fs.writeFileSync(path.join(input, 'config.json'), JSON.stringify(config, null, 2), { flag: 'wx', mode: 0o600 });
          NODE
      - name: One reviewed finite paired auth diagnostic (no production or providers)
        env:
          AUTH_HTTP_FIXTURE_512_LAUNCH_APPROVED: 'true'
        run: node services/stocks/auth-http-fixture-512/launcher.mjs --launch "$RUNNER_TEMP/stocks-auth-launch-input/config.json"
      - name: Preserve diagnostic verdict and bounded measurement reports only
