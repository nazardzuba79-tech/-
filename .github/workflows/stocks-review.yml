name: Stocks isolated review
on:
  pull_request:
    paths: ['services/stocks/**', 'frontend/src/pages/stocks/**', 'frontend/src/lib/stocks.ts', '.github/workflows/stocks-review.yml']
  push:
    branches: [codex/stocks-bounded-v1-20261007]
permissions:
  contents: read
jobs:
  bounded-stock-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voltex-stock-review -f services/stocks/Dockerfile .
      - name: Unit and actual read-only HTTP tests
        run: docker run --rm --network none --cpus .20 --memory 256m --memory-swap 256m --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=16m voltex-stock-review node --test core.test.mjs
      - name: Inspect actual cgroups and bounded private disk failure
        run: |
          mkdir -p stock-evidence
          docker run --rm --network none --cpus .20 --memory 256m --memory-swap 256m --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=8m --tmpfs /testdisk:size=8m voltex-stock-review node runtime-proof.mjs > stock-evidence/runtime.json
          cat stock-evidence/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-runtime-${{ github.sha }}
          path: stock-evidence
