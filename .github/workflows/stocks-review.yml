name: Stocks isolated review
on:
  pull_request:
    paths: ['services/stocks/**', 'frontend/src/pages/stocks/**', 'frontend/src/lib/stocks.ts', '.github/workflows/stocks-review.yml']
  push:
    branches: [codex/stocks-bounded-v1-20261007]
permissions:
  contents: read
jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:9/frontend_test_unused
      DIRECT_URL: postgresql://test:test@127.0.0.1:9/frontend_test_unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build --prefix frontend
      - run: node node_modules/jest/bin/jest.js frontend/src --runInBand --json --outputFile=frontend-stock-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-frontend-regression-${{ github.sha }}
          path: frontend-stock-review.json
  crypto-service-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration_qa
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: voltex_stock_qa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integration_qa -d voltex_stock_qa" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://integration_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_stock_qa
      DIRECT_URL: postgresql://integration_qa:ephemeral_ci_only@127.0.0.1:5432/voltex_stock_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate && npm run build && npx prisma migrate deploy
      - run: docker build -t voltex-stock-review -f services/stocks/Dockerfile .
      - name: Pin crypto and stock to the same CPU; keep load generator on another CPU
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          cpus=sorted(os.sched_getaffinity(0))
          assert len(cpus)>=2
          print('BENCH_CPU='+str(cpus[0]))
          print('LOAD_CPU='+str(cpus[1]))
          PY
      - name: Repeat A/B/C/readers/failure/cold cache comparison
        run: |
          docker update --cpuset-cpus "$BENCH_CPU" $(docker ps --filter ancestor=postgres:16 -q)
          taskset -c "$BENCH_CPU" node services/stocks/crypto-comparison.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-crypto-comparison-${{ github.sha }}
          path: .ci-output/stocks
  bounded-stock-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voltex-stock-review -f services/stocks/Dockerfile .
      - name: Unit and actual read-only HTTP tests
        run: docker run --rm --network none --cpus .05 --memory 256m --memory-swap 256m --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=16m voltex-stock-review node --test core.test.mjs
      - name: Inspect actual cgroups and bounded private disk failure
        run: |
          mkdir -p stock-evidence
          docker run --rm --network none --cpus .05 --memory 256m --memory-swap 256m --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=8m --tmpfs /testdisk:size=8m voltex-stock-review node runtime-proof.mjs > stock-evidence/runtime.json
          cat stock-evidence/runtime.json
      - name: Measure full 30-day fixture storage under the same hard budget
        run: |
          mkdir -p stock-storage
          docker run --rm --user "$(id -u):$(id -g)" --network none --cpus .05 --memory 256m --memory-swap 256m --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges --read-only --mount type=bind,src="$PWD/stock-storage",dst=/testdata -e STOCK_STORAGE_PROOF=isolated-ci voltex-stock-review node storage-proof.mjs > stock-evidence/storage.json
          cat stock-evidence/storage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-runtime-${{ github.sha }}
          path: stock-evidence
