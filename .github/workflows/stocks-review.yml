      - name: Verify disposable backing disk and separate load CPU
        run: |
          mkdir -p "$RUNNER_TEMP/targeted-http512-disk"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          cpus=sorted(os.sched_getaffinity(0))
          assert len(cpus)>=2
          print('BENCH_CPU='+str(cpus[0]))
          print('LOAD_CPU='+str(cpus[1]))
          PY
          majmin=$(findmnt -n -o MAJ:MIN -T "$RUNNER_TEMP/targeted-http512-disk" | tr -d '[:space:]')
          device=$(lsblk -nrpo NAME,MAJ:MIN | awk -v mm="$majmin" '$2==mm {print $1; exit}')
