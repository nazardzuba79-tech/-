# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Spot compact market rail
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-20261006-spot-market-7d.yml
  cancel-in-progress: false
jobs:
  spot-7d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Spot compact-list guards
        run: >-
          npx jest frontend/src/lib/__tests__/spotPairList7d.test.ts frontend/src/lib/__tests__/spotPairList.test.ts
          frontend/src/lib/__tests__/cryptoCatalogue.test.ts frontend/src/lib/__tests__/marketColumnSort.test.ts
      - name: Frontend TypeScript and production bundle
        run: npm run build --prefix frontend
      - name: Disposable browser tooling
        run: |
          npm install --prefix /tmp/spot-7d-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/spot-7d-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: 'Spot compact rail at 1920, 1440, 1366 and panel widths 240–340'
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/spot-7d-browser/node_modules/playwright
          QA_OUT: docs/qa/spot-market-7d/ci
        run: node scripts/qa-spot-market-7d.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'spot-compact-rail-${{ github.sha }}'
          path: docs/qa/spot-market-7d/ci
          if-no-files-found: warn
          retention-days: 7
