name: Deploy reviewed VOLTEX frontend to Cloudflare Pages
# Temporary read-only final verification. No deployment credentials or write operations.
on:
  push:
    branches: [release/eclv-628-frontend-20261027]
permissions:
  contents: read
concurrency:
  group: voltex-pages-production-release
  cancel-in-progress: false
jobs:
  verify-live-seo:
    if: contains(github.event.head_commit.message, '[verify-seo632]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_API_URL: https://api.voltextech.net/api/v1
      VITE_DEPOSIT_CATALOGUE_URL: https://voltex-deposit-catalogue-production.nazardzuba79.workers.dev
      VITE_MANUAL_DEPOSIT_CATALOGUE: 'true'
      SEO632_EXPECTED_SOURCE: 6118e18e49edd226a6b250154d3893773b4522e2
      SEO632_GIT_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce already-tested frontend tree for exact artifact comparison
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
      - name: Actual robots, XML, all42 public canonical heads, private noindex and entry hash
        run: node scripts/release-seo632.mjs smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo632-live-http-evidence
          path: output/seo632-release
          retention-days: 7
          if-no-files-found: warn
