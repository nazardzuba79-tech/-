name: History20 pinned installed candidate (no deployment)
on:
  push:
    branches: ['review/history20-installed-rc-20261104']
    paths:
      - 'scripts/ops/*history20-installed-candidate.cjs'
      - 'scripts/ops/check-history20-install-base.cjs'
      - 'scripts/qa/fixtures/history20-installed-*'
      - '.github/workflows/history20-installed-candidate.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  composed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: voltex_listing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d voltex_listing_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/voltex_listing_test
      DIRECT_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/voltex_listing_test
      VOLTEX_LISTING_TEST_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/voltex_listing_test
      QA_OUTPUT: output/history20-installed-candidate/browser
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix workers/market-edge --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Migrate the disposable loopback fixture only
        run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run build --prefix frontend
      - name: Browser tools isolated from application dependencies
        run: |
          npm install --prefix output/history20-qa-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node output/history20-qa-tools/node_modules/playwright/cli.js install --with-deps chromium
          echo "QA_PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/output/history20-qa-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - run: node scripts/ops/build-history20-installed-candidate.cjs
      - name: Composed binaries, PG isolation, preserved models, restart and browser
        run: node scripts/ops/verify-history20-installed-candidate.cjs --postgres --browser
      - name: Package code only, excluding local dependency links and database
        run: tar -czf output/history20-candidate.tgz -C output/history20-installed-candidate/candidate api worker.js manifest.json Dockerfile rollback-installed-api.tgz worker.rollback Dockerfile.rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history20-installed-candidate-${{ github.sha }}
          path: |
            output/history20-candidate.tgz
            output/history20-installed-candidate/verification.json
            output/history20-installed-candidate/candidate/manifest.json
            output/history20-installed-candidate/browser/
