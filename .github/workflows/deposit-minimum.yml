name: Deposit packages — manual approval only
'on':
  push:
    branches:
      - codex/release-qa-validation-20261006
permissions:
  contents: read
jobs:
  deposit-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9866714f1541bb878eb1aa01176d6ac97059b177
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = '9866714f1541bb878eb1aa01176d6ac97059b177'
          echo 'RELEASE_QA_SOURCE_SHA=9866714f1541bb878eb1aa01176d6ac97059b177'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npm run build --prefix frontend
      - name: 'Deposit, provider, auth and admin regression tests'
        run: >-
          npm test -- --runInBand --runTestsByPath src/services/__tests__/DepositService.test.ts
          src/api/routes/__tests__/adminDeposits.test.ts src/api/routes/__tests__/deposits.test.ts
          src/api/routes/__tests__/depositAddressCopies.test.ts src/services/__tests__/TreasuryWalletService.test.ts
          src/api/routes/__tests__/adminOverview.test.ts src/config/__tests__/chains.test.ts
          src/services/deposit-verifiers/__tests__/TronDepositVerifier.test.ts
          src/services/deposit-verifiers/__tests__/EvmDepositVerifier.test.ts
          src/services/deposit-verifiers/__tests__/BitcoinDepositVerifier.test.ts
          src/services/deposit-verifiers/__tests__/SolanaDepositVerifier.test.ts
          src/services/deposit-verifiers/__tests__/TonDepositVerifier.test.ts
          src/services/deposit-verifiers/__tests__/incomingBudget.test.ts
          src/services/deposits/__tests__/depositWatchSchedule.test.ts
          frontend/src/lib/__tests__/depositAllWallets.test.ts frontend/src/lib/__tests__/walletUnifiedAccount.test.ts
          frontend/src/lib/__tests__/adminDepositRails.test.ts
          frontend/src/lib/__tests__/adminConsoleInteractions.test.ts frontend/src/lib/__tests__/depositCopyLog.test.ts
          frontend/src/lib/__tests__/adminDepositCopies.test.ts
          frontend/src/lib/__tests__/creditDepositDrawerOutcome.test.ts
          frontend/src/lib/__tests__/adminUsersActivity.test.ts frontend/src/lib/__tests__/renderBandwidthBudget.test.ts
      - name: Install isolated PostgreSQL and browser tools
        run: >-
          npm install --prefix node_modules/.cache/deposit-qa --no-save --ignore-scripts
          @embedded-postgres/windows-x64@18.4.0-beta.17 pg@8.23.0 playwright@1.56.1
      - name: 'Real PostgreSQL packages, watcher recovery and production-bundle browser acceptance'
        run: |
          $env:QA_PLAYWRIGHT_MODULE = (Resolve-Path node_modules/.cache/deposit-qa/node_modules/playwright).Path
          node scripts/qa-deposit-packages.cjs --browser
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deposit-packages-acceptance
          path: output/deposit-packages
          retention-days: 7
concurrency:
  group: release-qa-validation-20261006-deposit-minimum.yml
  cancel-in-progress: false
