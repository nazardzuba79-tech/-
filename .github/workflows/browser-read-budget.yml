# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Browser read budget
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
jobs:
  read-budget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npm run build --prefix frontend
      - name: 'Real stores, mounted hooks, Futures and wallet preservation'
        run: >-
          npm test -- --runInBand --silent
          "--testPathPattern=frontend/src/lib/__tests__/(futures|accountReadLifecycle|adminConsoleInteractions|adminDepositRails|adminUsersActivity|renderBandwidthBudget|nativeLive|nativeTerminal|nativeFuturesTerminal|walletUnifiedAccount|browserReadBudget)"
concurrency:
  group: release-qa-20261006-browser-read-budget.yml
  cancel-in-progress: false
