name: Browser read budget
'on':
  push:
    branches:
      - codex/release-qa-final-20261006
permissions:
  contents: read
jobs:
  read-budget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ca69d47eaccccf18a1bd7e45e34452fcd60e9e91
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = 'ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
          echo 'RELEASE_QA_SOURCE_SHA=ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npm run build --prefix frontend
      - name: 'Real stores, mounted hooks, Futures and wallet preservation'
        run: >-
          npm test -- --runInBand --silent
          "--testPathPattern=frontend/src/lib/__tests__/(futures|accountReadLifecycle|adminConsoleInteractions|adminDepositRails|adminUsersActivity|renderBandwidthBudget|nativeLive|nativeTerminal|nativeFuturesTerminal|walletUnifiedAccount|browserReadBudget)"
concurrency:
  group: release-qa-final-20261006-browser-read-budget.yml
  cancel-in-progress: false
