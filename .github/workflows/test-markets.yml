name: Test markets (VOLTORA)

on:
  pull_request:
    paths:
      - 'src/services/testMarkets/**'
      - 'src/api/routes/testMarkets.ts'
      - 'src/api/routes/__tests__/testMarkets.test.ts'
      - 'src/index.ts'
      - 'src/services/OrderService.ts'
      - 'src/services/DemoTradingService.ts'
      - 'src/services/WithdrawalService.ts'
      - 'src/services/DepositService.ts'
      - 'src/services/BalanceAdjustmentService.ts'
      - 'frontend/src/lib/testMarkets.ts'
      - 'frontend/src/lib/testMarketStore.ts'
      - 'frontend/src/lib/testMarketCandles.ts'
      - 'frontend/src/lib/useMarketData.ts'
      - 'frontend/src/lib/priceChange.ts'
      - 'frontend/src/lib/__tests__/testMarkets.test.ts'
      - 'frontend/src/components/TestMarketTerminal.tsx'
      - 'frontend/src/components/OrderForm.tsx'
      - 'frontend/src/components/TickerBar.tsx'
      - 'frontend/src/lib/i18n/locales/**'
      - 'frontend/src/components/TerminalChart.tsx'
      - 'frontend/src/components/PriceChart.tsx'
      - 'frontend/src/pages/TradePage.tsx'
      - 'frontend/src/pages/markets-bolt/**'
      - 'scripts/qa-voltora-listing.cjs'
      - 'scripts/qa-spot-layout-stability.cjs'
      - 'frontend/src/components/SpotOrdersView.tsx'
      - 'frontend/src/pages/trade-terminal/TerminalPreviewPolish.css'
      - 'frontend/src/lib/__tests__/marketTickerIdentity.test.ts'
      - 'frontend/src/lib/__tests__/spotOrdersPresentation.test.ts'
      - '.github/workflows/test-markets.yml'
      - '.github/scripts/verify-ci-browser.cjs'

permissions:
  contents: read

jobs:
  test-markets:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust this checked-out workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Simulation, API and never-tradable guards
        run: >-
          npx jest --runInBand --silent --runTestsByPath
          src/services/testMarkets/__tests__/testMarketSimulation.test.ts
          src/services/testMarkets/__tests__/simulationRealism.test.ts
          src/services/testMarkets/__tests__/simulationCycles.test.ts
          src/services/testMarkets/__tests__/simulationAccumulation.test.ts
          src/services/testMarkets/__tests__/simulationNaturalWicks.test.ts
          src/services/testMarkets/__tests__/simulationWaves.test.ts
          src/services/testMarkets/__tests__/testMarketDepth.test.ts
          src/api/routes/__tests__/testMarkets.test.ts
          frontend/src/lib/__tests__/testMarkets.test.ts
          frontend/src/lib/__tests__/marketTickerIdentity.test.ts
          frontend/src/lib/__tests__/spotOrdersPresentation.test.ts
          frontend/src/lib/__tests__/spotChartPriceFormat.test.ts
          frontend/src/lib/__tests__/cfdTerminal.test.ts
          frontend/src/lib/__tests__/i18nLanguageChunks.test.ts
      - name: Backend typecheck
        run: npx tsc --noEmit
      - name: Production frontend build
        run: npm run build --prefix frontend
      - name: Disposable Chromium
        run: |
          npm install --prefix /tmp/voltora-preview-browser --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node .github/scripts/verify-ci-browser.cjs /tmp/voltora-preview-browser/node_modules/playwright 1.63.0 preinstalled
      - name: VOLTORA listing browser QA
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/voltora-preview-browser/node_modules/playwright
        run: node scripts/qa-voltora-listing.cjs
      - name: Spot background refresh geometry
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/voltora-preview-browser/node_modules/playwright
          QA_OUT: docs/qa/voltora-listing/layout-stability
        run: node scripts/qa-spot-layout-stability.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voltora-listing-${{ github.sha }}
          path: docs/qa/voltora-listing/
          if-no-files-found: ignore
          retention-days: 7
