# Isolated release QA. Application checkout pinned to current main; no deployment jobs.
name: Browser idle sleep
'on':
  push:
    branches:
      - codex/release-qa-20261006
permissions:
  contents: read
jobs:
  idle-sleep:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4daae9f3c2d42d5d9df6e8b061d77cc5331053b7
      - name: Verify frozen main input
        run: |-
          test "$(git rev-parse HEAD)" = '4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          echo 'RELEASE_QA_SOURCE_SHA=4daae9f3c2d42d5d9df6e8b061d77cc5331053b7'
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: npm run build --prefix frontend
      - name: Lifecycle and existing visible-read invariants
        run: node --test scripts/test-browser-activity.cjs scripts/test-idle-read-budget.cjs
      - name: Isolated PostgreSQL and browser tools
        run: >-
          npm install --prefix node_modules/.cache/browser-sleep-qa --no-save --ignore-scripts
          @embedded-postgres/windows-x64@18.4.0-beta.17 pg@8.23.0 playwright@1.56.1
      - name: 'Persistence, browser request budget and native cold restart'
        shell: pwsh
        run: |
          $env:BROWSER_SLEEP_QA_DEPS = Join-Path $pwd 'node_modules/.cache/browser-sleep-qa/package.json'
          $env:PLAYWRIGHT_MODULE = Join-Path $pwd 'node_modules/.cache/browser-sleep-qa/node_modules/playwright'
          $env:QA_LABEL = 'candidate'
          node scripts/qa-browser-sleep-postgres.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/qa-browser-sleep.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/qa-browser-sleep-native.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-idle-sleep
          path: output/browser-sleep*
concurrency:
  group: release-qa-20261006-browser-idle-sleep.yml
  cancel-in-progress: false
