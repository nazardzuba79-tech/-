name: Support form (Cloudflare Worker + widget)

# Support is a form: the widget posts once to the voltex-support-edge Worker,
# which emails the owner through Cloudflare Email Routing. Verify the Worker
# contract, the widget and the built bundle on every change; deploy the
# Worker only from main (or an explicitly tagged push / manual run).
on:
  pull_request:
    paths:
      - 'workers/support-edge/**'
      - 'frontend/src/components/SupportWidget.tsx'
      - 'frontend/src/components/SupportWidget.css'
      - 'frontend/src/lib/supportForm.ts'
      - 'frontend/src/lib/supportEndpoint.ts'
      - 'frontend/src/lib/__tests__/supportForm.test.ts'
      - 'scripts/qa-support-form.cjs'
      - '.github/workflows/support-form.yml'
  push:
    branches: [main, claude/support-simple-form]
    paths:
      - 'workers/support-edge/**'
      - '.github/workflows/support-form.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-form-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker contract tests
        run: node workers/support-edge/test.mjs
      - name: Wrangler dry-run
        working-directory: workers/support-edge
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Widget, i18n and route tests
        run: >-
          npm test -- --runInBand --runTestsByPath
          frontend/src/lib/__tests__/supportForm.test.ts
          frontend/src/lib/__tests__/i18nLanguageChunks.test.ts
          frontend/src/lib/__tests__/routeCodeSplitting.test.ts
          src/services/__tests__/NodemailerCompatibility.test.ts
      - name: Production build has no mail secret
        run: |
          npm run build --prefix frontend
          if grep -R -l -E "SMTP_PASS|SMTP_USER|SUPPORT_ADMIN_EMAIL|voltex\.crypto@gmail\.com|CLOUDFLARE_API_TOKEN" frontend/dist; then
            echo "secret-like string in the bundle"; exit 1
          fi
          grep -R -q "support.voltextech.net/v1/support" frontend/dist
      - name: QA bundle (endpoint = local Worker adapter)
        run: VITE_SUPPORT_ENDPOINT=http://127.0.0.1:8799/v1/support npm run build --prefix frontend
      - name: Install disposable browser
        run: |
          npm install --prefix /tmp/support-form-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/support-form-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser QA - form, one email, prefill, layout, idle
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/support-form-qa/node_modules/playwright
        run: node scripts/qa-support-form.cjs
      - name: Preserve browser evidence
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: support-form-${{ github.sha }}
          path: docs/qa/support-form/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[deploy-support-edge]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/support-edge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c379227476dedde6dff09c787ffdb510
      - name: Production identity and refusal smoke (sends no email)
        run: |
          ok=0
          for attempt in $(seq 1 24); do
            if health="$(curl --connect-timeout 5 --max-time 10 -fsS https://support.voltextech.net/health)" \
              && printf '%s' "$health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify(j));if(j.ok!==true||j.service!=='voltex-support-edge'||j.version!=='support-form-v1'||j.configured!==true)process.exit(1)})"; then
              ok=1; break
            fi
            echo "waiting_for_worker attempt=$attempt"; sleep 5
          done
          test "$ok" = "1"
          pre="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://voltextech.net' https://support.voltextech.net/v1/support)"
          echo "preflight_allowed_origin=$pre"; test "$pre" = "204"
          foreign="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' --data '{}' https://support.voltextech.net/v1/support)"
          echo "foreign_origin_post=$foreign"; test "$foreign" = "403"
