name: Support form (Cloudflare Worker + widget)
'on':
  push:
    branches:
      - codex/release-qa-final-20261006
permissions:
  contents: read
concurrency:
  group: release-qa-final-20261006-support-form.yml
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ca69d47eaccccf18a1bd7e45e34452fcd60e9e91
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = 'ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
          echo 'RELEASE_QA_SOURCE_SHA=ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker contract tests
        run: node workers/support-edge/test.mjs
      - name: Wrangler dry-run
        working-directory: workers/support-edge
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: 'Widget, i18n and route tests'
        run: >-
          npm test -- --runInBand --runTestsByPath frontend/src/lib/__tests__/supportForm.test.ts
          frontend/src/lib/__tests__/supportAssistant.test.ts frontend/src/lib/__tests__/i18nLanguageChunks.test.ts
          frontend/src/lib/__tests__/routeCodeSplitting.test.ts
      - name: Production build has no mail secret
        run: >
          npm run build --prefix frontend

          # The exact protected-owner email comparison in

          # frontend/src/pages/admin/DeleteUserDialog.tsx is an intentional identity.

          # frontend/src/lib/__tests__/supportForm.test.ts permits only that guard

          # and rejects that address elsewhere; actual mail/token markers stay forbidden.

          if grep -R -l -E
          "SMTP_PASS|SMTP_USER|SUPPORT_ADMIN_EMAIL|SUPPORT_FROM_EMAIL|SUPPORT_RELAY_KEY|CLOUDFLARE_API_TOKEN"
          frontend/dist; then
            echo "secret-like string in the bundle"; exit 1
          fi

          grep -R -q "/support/request" frontend/dist
      - name: QA bundle (endpoint = local Worker adapter)
        run: npm run build --prefix frontend
      - name: Install disposable browser
        run: |
          npm install --prefix /tmp/support-form-qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node /tmp/support-form-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: 'Browser QA - form, one email, prefill, layout, idle'
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/support-form-qa/node_modules/playwright
        run: node scripts/qa-support-form.cjs
      - name: Admin spam browser QA
        env:
          QA_PLAYWRIGHT_MODULE: /tmp/support-form-qa/node_modules/playwright
          QA_OUT: docs/qa/support-form/admin
        run: node scripts/qa-admin-spam.cjs
      - name: Preserve browser evidence
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: 'support-form-${{ github.sha }}'
          path: docs/qa/support-form/
          if-no-files-found: ignore
          retention-days: 7
  blacklist-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: 'postgres:16'
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: voltex_email_policy_test
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10'
    env:
      DATABASE_URL: 'postgresql://postgres@127.0.0.1:5432/voltex_email_policy_test'
      DIRECT_URL: 'postgresql://postgres@127.0.0.1:5432/voltex_email_policy_test'
      EMAIL_POLICY_TEST_URL: 'postgresql://postgres@127.0.0.1:5432/voltex_email_policy_test'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca69d47eaccccf18a1bd7e45e34452fcd60e9e91
          persist-credentials: false
      - name: Verify frozen main source
        run: |-
          test "$(git rev-parse HEAD)" = 'ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
          echo 'RELEASE_QA_SOURCE_SHA=ca69d47eaccccf18a1bd7e45e34452fcd60e9e91'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate && npx prisma db push --skip-generate
      - run: npm run build
      - run: >-
          npm test -- --runInBand --runTestsByPath src/api/routes/__tests__/contactPolicy.pg.test.ts
          src/api/routes/__tests__/contactPolicy.test.ts src/api/routes/__tests__/auth.test.ts
          src/api/middleware/__tests__/auth.test.ts src/api/routes/__tests__/bcryptAuthRegression.test.ts
