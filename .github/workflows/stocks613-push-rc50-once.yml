name: Stocks 613 one-time isolated PUSH_DIAGNOSTIC (synthetic report only)
on:
  push:
    branches: [review/stocks613-push-rc50-driver-20261029]
    paths: ['.github/workflows/stocks613-push-rc50-once.yml']
permissions:
  contents: read
concurrency:
  group: stocks613-push-rc50-once-20261029
  cancel-in-progress: false
jobs:
  push-50-plus-2:
    if: contains(github.event.head_commit.message, 'PUSH-DIAGNOSTIC-ONCE-29OCT')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d9782e86c6d89a980a0739c26599bbf55359008
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Pin exact existing Stocks PR head and reject changed runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2d9782e86c6d89a980a0739c26599bbf55359008'
          test "$(git rev-parse 7942c59ddfbf902a6183c397f766bcc8aca8c039:services/stocks-global/viewer-stream.mjs)" = "$(git rev-parse HEAD:services/stocks-global/viewer-stream.mjs)"
          node --check scripts/qa/stocks-rc-50plus2/diagnostic-run-613.cjs
          node --check scripts/qa/stocks-rc-50plus2/push-viewers.cjs
      - name: Locked dependencies and synthetic Prisma client only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate
          sudo install -d -m 1777 /var/run/postgresql
      - name: Sanity tests — no benchmark
        run: |
          node --test scripts/qa/stocks-rc-50plus2/push-viewers.test.cjs
      - name: Prepare runtime at exact approved R10 source; copy only harness
        run: |
          set -euo pipefail
          W="$(dirname "$GITHUB_WORKSPACE")/rc50-push-one"
          mkdir -p "$W"
          git worktree add --detach "$W/after" 7942c59ddfbf902a6183c397f766bcc8aca8c039
          cp scripts/qa/stocks-rc-50plus2/*.cjs "$W/after/scripts/qa/stocks-rc-50plus2/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$W/after/node_modules"
          echo "PUSH_RC50_DIR=$W" >> "$GITHUB_ENV"
          echo "Node: $(node -v); host CPUs: $(nproc --all)"
      - name: ONE paired 50 SSE viewers + 2 original traders; clients on other core
        run: |
          set -uo pipefail
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "PUSH_DIAGNOSTIC_REPORT_ONLY — never production, not capacity acceptance"
          set +e
          (cd "$PUSH_RC50_DIR/after" && taskset -c 2,3 node scripts/qa/stocks-rc-50plus2/diagnostic-run-613.cjs \
            --after --isolated-clients --push-viewers \
            --root . --pg-bin "$PG_BIN" --out "$PUSH_RC50_DIR/result" \
            --scope ci-diagnostic --ack SYNTHETIC_LOCAL_ONLY --run-local)
          code=$?
          set -e
          echo "$code" > "$PUSH_RC50_DIR/exit-code"
          echo "## PUSH_DIAGNOSTIC 50+2" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime pin R10 7942c59d, harness 2d9782e8, 50 SSE viewers / 2 traders 4-second cycle." >> "$GITHUB_STEP_SUMMARY"
          node -e 'const fs=require("fs");const p=process.argv[1];if(!fs.existsSync(p)){console.log("PUSH_RUN_MISSING_REPORT");process.exit(0)}const r=JSON.parse(fs.readFileSync(p,"utf8")),f=r.comparison||{};console.log(JSON.stringify({status:r.status,fullWorkloadRuns:r.fullWorkloadRuns,baselineP95:f.baselineCryptoP95Ms,mixedP95:f.mixedCryptoP95Ms,deltaPct:f.cryptoP95ChangePercent,reportOnly:true,failures:r.failures,finished:r.finishedAt}));' "$PUSH_RC50_DIR/result/result.json" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 0
      - name: Collect non-secret read-only results even on failure
        if: always()
        run: |
          mkdir -p output/one-push
          for file in admission.json baseline-result.json mixed-result.json comparison.json result.json; do
            if [ -f "$PUSH_RC50_DIR/result/$file" ]; then cp "$PUSH_RC50_DIR/result/$file" output/one-push/; fi
          done
          if [ -f "$PUSH_RC50_DIR/exit-code" ]; then cp "$PUSH_RC50_DIR/exit-code" output/one-push/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks613-push-diagnostic-one-20261029
          path: output/one-push
          retention-days: 7
          if-no-files-found: warn
