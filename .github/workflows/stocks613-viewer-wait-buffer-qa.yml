name: Stocks #613 bounded viewer-wait stream review (no deploy)
on:
  push:
    branches:
      - review/stocks613-push-wait-buffer-20261029
permissions:
  contents: read
jobs:
  viewer-wait-backpressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify narrowly scoped source and immutable parent
        run: |
          node <<'NODE'
          const cp = require('node:child_process'), assert = require('node:assert/strict');
          const parent = '11da3a3cf62b342ae3a13aef81b0f1ffb5386f54';
          const changed = cp.execFileSync('git',['diff','--name-only',parent,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(changed,[
            '.github/workflows/stocks613-viewer-wait-buffer-qa.yml',
            'services/stocks-global/viewer-stream.mjs',
            'services/stocks-global/viewer-stream.test.mjs'
          ]);
          console.log('REVIEW_SCOPE_PASS');
          NODE
      - name: Install locked dependencies with scripts disabled
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Viewer-stream authorization, public-only quotes and backpressure
        run: node --test services/stocks-global/viewer-stream.test.mjs
      - name: Nearby connection-admission and identity policy unit tests
        run: node --test services/stocks-global/connection-admission.test.mjs services/stocks-global/identity-batch.test.mjs
