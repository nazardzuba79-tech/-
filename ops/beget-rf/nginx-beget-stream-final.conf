# Opaque VOLTEX relay. No TLS key, HTTP upstream or local JavaScript.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/voltex-stream-error.log crit;
events { worker_connections 1024; }
stream {
  access_log off;
  map $ssl_preread_server_name $voltex_fixed_target {
    default "";
    ru.voltextech.net 138.199.227.130:18444;
  }
  server {
    listen 443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
    proxy_next_upstream off;
    proxy_protocol on;
    proxy_pass $voltex_fixed_target;
  }
  server {
    listen 80;
    proxy_connect_timeout 5s;
    proxy_timeout 15s;
    proxy_next_upstream off;
    proxy_pass 138.199.227.130:18080;
  }
}

