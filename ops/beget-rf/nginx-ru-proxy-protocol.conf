server {
  listen 18444 ssl http2 proxy_protocol;
  server_name ru.voltextech.net;
  ssl_certificate /etc/letsencrypt/live/ru.voltextech.net/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/ru.voltextech.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  server_tokens off;
  resolver 127.0.0.53 ipv6=off valid=300s;
  allow 185.23.35.226;
  allow 127.0.0.1; deny all;
  access_log off; error_log /opt/voltex-rf-endpoint/error.log crit;
  client_max_body_size 10m;
  client_body_temp_path /opt/voltex-rf-endpoint/client;
  proxy_temp_path /opt/voltex-rf-endpoint/proxy;
  if ($host != "ru.voltextech.net") { return 444; }
  if ($voltex_ru_foreign) { return 403; }
  if ($voltex_ru_unsafe) { return 403; }
  if ($voltex_ru_sensitive) { return 403; }
  if ($voltex_ru_kyc_denied) { return 403; }
  if ($voltex_ru_ambiguous) { return 400; }
  if ($proxy_protocol_addr = "") { return 444; }
  location = /_voltex/health { default_type text/plain; add_header Cache-Control no-store always; return 200 "voltex-rf-hetzner\n"; }
  location ^~ /api/v1/ {
    if ($voltex_ru_api_allowed = 0) { return 403; }
    set $voltex_ru_target 127.0.0.1:13020;
    proxy_pass http://$voltex_ru_target$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host api.voltextech.net;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host ru.voltextech.net;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    proxy_store off;
    proxy_read_timeout 90s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_set_header Origin $voltex_ru_origin;
  }
  location ~ ^/_voltex/kyc(?<voltex_ru_kyc>/v1/(?:submit|materials|confirm))$ {
    set $voltex_ru_target kyc.voltextech.net;
    proxy_pass https://$voltex_ru_target$voltex_ru_kyc$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host kyc.voltextech.net;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host ru.voltextech.net;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    proxy_store off;
    proxy_read_timeout 90s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_ssl_server_name on;
    proxy_ssl_name kyc.voltextech.net;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Origin $voltex_ru_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    client_max_body_size 4259840;
    if ($request_method !~ "^(POST|OPTIONS)$") { return 405; }
    proxy_set_header X-Voltex-Ru-Client-IP $proxy_protocol_addr;
  }
  location ~ "^(?:/_voltex/market){1,2}(?<voltex_ru_market>/(?:market/(?:display|listings|test-assets|nrx)(?:/[^?]*)?|cfd/display/[^?]*|health))$" {
    set $voltex_ru_target market.voltextech.net;
