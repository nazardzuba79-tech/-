    add_header Strict-Transport-Security "max-age=86400" always;
    proxy_ssl_server_name on;
    proxy_ssl_name voltextech.net;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    proxy_set_header Accept-Encoding "";
    proxy_redirect https://voltextech.net/ https://ru.voltextech.net/;
    sub_filter_once off;
    sub_filter_types text/css application/javascript text/javascript;
    add_header Content-Security-Policy "connect-src 'self' wss://ru.voltextech.net" always;
    sub_filter 'https://api.voltextech.net' 'https://ru.voltextech.net';
    sub_filter 'https://market.voltextech.net' 'https://ru.voltextech.net/_voltex/market';
    sub_filter 'https://kyc.voltextech.net' 'https://ru.voltextech.net/_voltex/kyc';
    sub_filter 'https://voltex-deposit-catalogue-production.nazardzuba79.workers.dev' 'https://ru.voltextech.net/_voltex/catalogue';
    sub_filter 'https://api.kraken.com' 'https://ru.voltextech.net/_voltex/kraken';
