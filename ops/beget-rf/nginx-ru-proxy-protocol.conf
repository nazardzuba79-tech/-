  location /_voltex/ { return 404; }
  location / {
    set $voltex_ru_target voltextech.net;
    proxy_pass https://$voltex_ru_target$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host voltextech.net;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
