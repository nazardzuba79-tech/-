# Generated by ops/beget-rf/render.py. Dedicated Beget node only.
user www-data;
worker_processes 1;
pid /etc/nginx/voltex-rf/nginx.pid;
error_log /etc/nginx/voltex-rf/error.log crit;
events { worker_connections 1024; }
http {
  default_type application/octet-stream;
  resolver 127.0.0.53 ipv6=off valid=300s;
  # No query strings, IPs, tokens, cookies, request bodies or financial values.
  log_format gateway '$request_method $status $request_time $upstream_status $upstream_response_time';
  access_log /etc/nginx/voltex-rf/access.log gateway;
  limit_conn_zone $binary_remote_addr zone=gateway_connections:1m;
  map $http_origin $foreign_origin { default 1; "" 0; "https://ru.voltextech.net" 0; }
  map $http_origin $canonical_app_origin { default ""; "https://ru.voltextech.net" "https://voltextech.net"; }
  map "$request_method:$http_origin" $unsafe_origin {
    default 1;
    ~^(GET|HEAD): 0;
    ~^(POST|PUT|PATCH|DELETE|OPTIONS):https://ru\.voltextech\.net$ 0;
  }
  server_tokens off;
  client_max_body_size 5m;
  client_body_temp_path /etc/nginx/voltex-rf/client;
  proxy_temp_path /etc/nginx/voltex-rf/proxy;
  server { listen 80 default_server; server_name _; return 444; }
  server {
    listen 80;
    server_name ru.voltextech.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/voltex-acme; }
    location / { return 503; }
  }
}
