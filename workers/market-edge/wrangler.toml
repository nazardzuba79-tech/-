# VOLTEX public market data edge (Cloudflare Workers Free).
# Isolated from Pages (frontend/), Render and Neon. One Durable Object: managed listings.
name = "voltex-market-edge"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
account_id = "c379227476dedde6dff09c787ffdb510"
workers_dev = true
preview_urls = false

routes = [
  { pattern = "market.voltextech.net", custom_domain = true }
]

# Managed listings (Admin → Listings): one SQLite Durable Object, its own
# namespace, its own secret. Public reads of PUBLISHED listings only; drafts
# and the admin API (/internal/listings) need LISTINGS_STORE_TOKEN, set with
# `wrangler secret put LISTINGS_STORE_TOKEN` in an authorized deploy step.
[[durable_objects.bindings]]
name = "LISTINGS"
class_name = "ManagedListingsDO"

[[migrations]]
tag = "listings-v1"
new_sqlite_classes = ["ManagedListingsDO"]
